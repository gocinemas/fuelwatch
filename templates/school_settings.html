<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Comms — Miru</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a1a2e;
    --accent: #f59e0b;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--gray-50);
    color: var(--primary);
    min-height: 100vh;
  }

  .header {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-logo { font-size: 22px; font-weight: 900; color: var(--primary); text-decoration: none; }
  .header-logo span { color: var(--accent); }
  .header-sub { font-size: 13px; color: var(--gray-400); }

  .container { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }

  .hero { margin-bottom: 32px; }
  .hero h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
  .hero p { font-size: 15px; color: var(--gray-600); line-height: 1.6; }

  /* School Cards */
  .schools-grid {
    display: grid;
    gap: 16px;
    margin-bottom: 32px;
  }

  .school-card {
    background: #fff;
    border-radius: 16px;
    border: 1.5px solid var(--gray-200);
    padding: 20px;
    position: relative;
    transition: box-shadow .2s, border-color .2s;
  }
  .school-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(245,158,11,.08); }

  .school-header {
    display: flex;
    align-items: start;
    gap: 12px;
    margin-bottom: 16px;
  }
  .school-emoji {
    font-size: 32px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--gray-100);
    border-radius: 12px;
  }

  .school-info { flex: 1; }
  .school-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .school-child {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 6px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 4px;
  }
  .status-badge.connected {
    background: #d1fae5;
    color: #065f46;
  }
  .status-badge.syncing {
    background: #dbeafe;
    color: #1e40af;
  }
  .status-badge.error {
    background: #fee2e2;
    color: #991b1b;
  }

  .school-details {
    background: var(--gray-50);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    font-size: 13px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
  }
  .detail-label { color: var(--gray-600); font-weight: 500; }
  .detail-value { color: var(--primary); word-break: break-word; }

  .email-preview {
    background: var(--gray-50);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .email-label { color: var(--gray-600); font-weight: 500; margin-bottom: 6px; }
  .email-list { display: flex; flex-direction: column; gap: 4px; }
  .email-addr {
    color: var(--primary);
    word-break: break-all;
    padding: 6px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid var(--gray-200);
  }
  .email-more {
    color: var(--gray-600);
    font-size: 12px;
    padding: 6px;
    font-weight: 500;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--gray-600);
    padding: 8px 0;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gray-400);
  }
  .sync-dot.active { background: var(--success); }

  .card-actions {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-200);
  }
  .btn-action {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--gray-200);
    background: #fff;
    color: var(--primary);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    font-family: inherit;
  }
  .btn-action:hover { background: var(--gray-50); border-color: var(--gray-400); }
  .btn-action.danger { color: var(--error); border-color: #fca5a5; }
  .btn-action.danger:hover { background: #fee2e2; }

  .btn-add-school {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 24px;
  }
  .btn-add-school:hover { background: var(--accent); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-600);
  }
  .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; margin-bottom: 16px; }

  /* Responsive */
  @media (max-width: 640px) {
    .container { padding: 24px 16px 60px; }
    .hero h1 { font-size: 24px; }
    .school-card { padding: 16px; }
    .school-emoji { width: 40px; height: 40px; font-size: 28px; }
    .school-name { font-size: 15px; }
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    max-width: 480px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 20px;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--gray-400);
  }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="header-logo">Miru<span>.</span></a>
  <span class="header-sub">School Comms</span>
</div>

<div class="container">
  <div class="hero">
    <h1>📚 School Updates</h1>
    <p>Track school emails for Riaan & Inaaya. Set up Gmail scanning to get event alerts on WhatsApp.</p>
  </div>

  <button class="btn-add-school" onclick="showAddSchoolModal()">+ Add a School</button>

  <div class="schools-grid" id="schoolsGrid">
    <!-- Schools loaded here -->
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    <div class="empty-state-icon">📍</div>
    <p>No schools added yet</p>
    <button class="btn-add-school" onclick="showAddSchoolModal()">Add First School</button>
  </div>

  <!-- Week ahead section -->
  <div id="weekAheadSection" style="display: none; margin-top: 32px;">
    <div class="hero">
      <h1>📅 This Week</h1>
      <p>School events coming up this week</p>
    </div>
    <div id="weekAheadGrid" style="display: grid; gap: 12px;"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="addSchoolModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header">Add School</div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">Child Name</label>
      <input type="text" id="childName" placeholder="e.g. Riaan" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
    </div>

    <div style="margin-bottom: 16px; position: relative;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">School Name</label>
      <input type="text" id="schoolName" placeholder="e.g. Stanns Heath Junior School" oninput="searchSchools()" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
      <div id="schoolSearchResults" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--gray-200); border-top: none; border-radius: 0 0 10px 10px; z-index: 10; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">Address <span style="color: #9ca3af; font-weight: 400;">(optional)</span></label>
      <input type="text" id="schoolAddress" placeholder="School address (auto-filled if found, or type manually)" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">School Email <span style="color: #9ca3af; font-weight: 400;">(optional)</span></label>
      <input type="email" id="schoolEmail" placeholder="e.g. office@school.sch.uk" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
      <div style="font-size: 11px; color: #9ca3af; margin-top: 4px;">Email address where school sends updates (you can add this later)</div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 24px;">
      <button class="btn-add-school" onclick="saveSchool()" style="flex: 1;">Save School</button>
      <button class="btn-add-school" onclick="closeModal()" style="flex: 1; background: #9ca3af;">Cancel</button>
    </div>
  </div>
</div>

<!-- Edit School Modal -->
<div class="modal" id="editSchoolModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <div class="modal-header">Edit School</div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">Child Name</label>
      <input type="text" id="editChildName" placeholder="e.g. Riaan" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
    </div>

    <div style="margin-bottom: 16px; position: relative;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">School Name</label>
      <input type="text" id="editSchoolName" placeholder="e.g. Stanns Heath Junior School" oninput="searchSchoolsEdit()" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
      <div id="editSchoolSearchResults" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--gray-200); border-top: none; border-radius: 0 0 10px 10px; z-index: 10; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">Address</label>
      <input type="text" id="editSchoolAddress" placeholder="Auto-filled when you pick a school" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="font-weight: 600; color: var(--primary); margin-bottom: 8px; display: block;">School Email <span style="color: #9ca3af; font-weight: 400;">(optional)</span></label>
      <input type="email" id="editSchoolEmail" placeholder="e.g. office@school.sch.uk" style="width: 100%; padding: 12px; border: 1px solid var(--gray-200); border-radius: 10px; font-family: inherit; font-size: 15px;">
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="btn-add-school" onclick="saveEditedSchool()" style="margin-top: 24px; flex: 1;">Save Changes</button>
      <button class="btn-add-school" onclick="closeEditModal()" style="margin-top: 24px; flex: 1; background: #9ca3af;">Cancel</button>
    </div>
  </div>
</div>

<script>
  let schools = [];

  async function loadSchools() {
    try {
      // Try to get phone from URL parameter first (from OAuth redirect)
      const params = new URLSearchParams(window.location.search);
      let wa = params.get('wa');

      // Fallback to phone from localStorage
      if (!wa) {
        wa = localStorage.getItem('school_wa') || localStorage.getItem('miru_phone');
      }

      let url = '/api/user/schools';
      if (wa) {
        url += `?wa=${encodeURIComponent(wa)}`;
      } else {
        const token = localStorage.getItem('_miruToken');
        if (token) url += `?token=${encodeURIComponent(token)}`;
      }

      const res = await fetch(url);
      const data = await res.json();
      schools = data.profiles || data.schools || [];
      renderSchools();
    } catch (e) {
      console.error('Failed to load schools:', e);
    }
  }

  function renderSchools() {
    const grid = document.getElementById('schoolsGrid');
    const empty = document.getElementById('emptyState');

    if (schools.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    grid.innerHTML = schools.map((s, i) => `
      <div class="school-card">
        <div class="school-header">
          <div class="school-emoji">📚</div>
          <div class="school-info">
            <div class="school-name">${s.school_name}</div>
            <div class="school-child">👤 ${s.child_name}</div>
            <div class="status-badge connected">
              <span>✓</span> Connected
            </div>
          </div>
        </div>

        <div class="school-details">
          <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="detail-value">Active</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Last sync:</span>
            <span class="detail-value">Just now</span>
          </div>
        </div>

        ${s.email ? `
          <div class="email-preview">
            <div class="email-label">📧 Connected Email</div>
            <div class="email-list">
              <div class="email-addr">${s.email}</div>
            </div>
          </div>
        ` : ''}

        <div class="sync-status">
          <div class="sync-dot active"></div>
          Syncing every 6 hours
        </div>

        <div class="card-actions">
          <button class="btn-action" onclick="editSchool('${s.id}')">✏️ Edit</button>
          <button class="btn-action danger" onclick="deleteSchool(${i})">🗑 Remove</button>
        </div>
      </div>
    `).join('');
  }

  function showAddSchoolModal() {
    document.getElementById('addSchoolModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('addSchoolModal').classList.remove('show');
  }

  async function saveSchool() {
    const childName = document.getElementById('childName').value.trim();
    const schoolName = document.getElementById('schoolName').value.trim();
    const address = document.getElementById('schoolAddress').value.trim();
    const schoolEmail = document.getElementById('schoolEmail').value.trim();

    if (!childName || !schoolName) {
      alert('Please enter child name and school name');
      return;
    }

    if (schoolEmail && !schoolEmail.includes('@')) {
      alert('Please enter a valid email address');
      return;
    }

    try {
      // Get phone from URL or localStorage
      const params = new URLSearchParams(window.location.search);
      let wa = params.get('wa') || localStorage.getItem('school_wa') || localStorage.getItem('miru_phone');

      let url = '/api/school/signup';
      const body = {
        child_name: childName,
        school_name: schoolName,
        address: address,
        sender_emails: schoolEmail ? [schoolEmail] : []
      };
      if (wa) body.wa_number = wa;

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('childName').value = '';
        document.getElementById('schoolName').value = '';
        document.getElementById('schoolEmail').value = '';
        closeModal();
        alert('✓ School added! Gmail connection needed next.');
        loadSchools();
      } else {
        alert('Error: ' + (data.error || 'Failed to save'));
      }
    } catch (e) {
      console.error('Save failed:', e);
      alert('Error saving school: ' + e.message);
    }
  }

  async function editAddress(i) {
    const school = schools[i];
    const newAddress = prompt(`Update location for ${school.school_name}:\n\n(Leave empty for no address)`, school.address || '');

    if (newAddress !== null) {
      try {
        const res = await fetch('/api/school/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: school.id,
            address: newAddress.trim()
          })
        });

        if (res.ok) {
          schools[i].address = newAddress.trim();
          renderSchools();
          alert('✓ Address saved');
        } else {
          const err = await res.json();
          alert('Error: ' + (err.error || 'Failed to save'));
        }
      } catch (e) {
        console.error('Save error:', e);
        alert('Error saving address: ' + e.message);
      }
    }
  }

  function deleteSchool(i) {
    if (confirm(`Remove ${schools[i].school_name}?`)) {
      schools.splice(i, 1);
      renderSchools();
    }
  }

  async function loadWeekAhead() {
    try {
      const params = new URLSearchParams(window.location.search);
      let wa = params.get('wa');
      if (!wa) {
        wa = localStorage.getItem('school_wa') || localStorage.getItem('miru_phone');
      }

      if (!wa) return;

      const res = await fetch(`/api/school/week-ahead?wa=${encodeURIComponent(wa)}`);
      const data = await res.json();
      renderWeekAhead(data);
    } catch (e) {
      console.warn('Failed to load week ahead:', e);
    }
  }

  function renderWeekAhead(data) {
    const section = document.getElementById('weekAheadSection');
    const grid = document.getElementById('weekAheadGrid');

    if (!data || !data.success || !data.by_day || Object.keys(data.by_day).length === 0) {
      section.style.display = 'none';
      return;
    }

    section.style.display = 'block';
    grid.innerHTML = '';

    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // Render each day's events (already grouped by server)
    Object.keys(data.by_day).sort().forEach(date => {
      const events = data.by_day[date];
      const dateObj = new Date(date + 'T00:00:00');
      const dayName = dayNames[dateObj.getDay()];
      const dayNum = dateObj.getDate();
      const monthName = monthNames[dateObj.getMonth()];

      let html = `<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px;">
        <div style="font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px;">
          ${dayName} ${dayNum} ${monthName}
        </div>`;

      events.forEach(ev => {
        const time = ev.time || '';
        const title = ev.title || 'Event';
        const child = ev.child || '';
        const icon = ev.emoji || '🏫';

        html += `<div style="padding: 8px 0; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-start;">
          <span style="font-size: 16px; flex-shrink: 0;">${icon}</span>
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 12px; font-weight: 600; color: var(--text);">${title}</div>
            ${child ? `<div style="font-size: 11px; color: var(--muted); margin-top: 2px;">👤 ${child}</div>` : ''}
            ${time ? `<div style="font-size: 11px; color: var(--muted); margin-top: 2px;">⏰ ${time}</div>` : ''}
          </div>
        </div>`;
      });

      html += `</div>`;
      grid.innerHTML += html;
    });
  }

  // School search autocomplete
  async function searchSchools() {
    const query = document.getElementById('schoolName').value.trim();
    const resultsDiv = document.getElementById('schoolSearchResults');

    if (!query || query.length < 2) {
      resultsDiv.style.display = 'none';
      return;
    }

    try {
      const res = await fetch(`/api/school/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();

      if (!data.schools || data.schools.length === 0) {
        resultsDiv.style.display = 'none';
        return;
      }

      resultsDiv.innerHTML = data.schools.map(s => `
        <div onclick="selectSchool('${s.name.replace(/'/g, "\\'")}', '${s.address.replace(/'/g, "\\'")}')"
          style="padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; hover-background: var(--bg);">
          <div style="font-weight: 600; font-size: 13px;">${s.name}</div>
          <div style="font-size: 11px; color: var(--muted);">${s.address || 'No address'}</div>
        </div>
      `).join('');
      resultsDiv.style.display = 'block';
    } catch (e) {
      console.error('School search error:', e);
    }
  }

  function selectSchool(name, address) {
    document.getElementById('schoolName').value = name;
    document.getElementById('schoolAddress').value = address;
    document.getElementById('schoolSearchResults').style.display = 'none';
  }

  // Edit school flow
  let currentEditSchoolId = null;

  async function editSchool(schoolId) {
    const school = schools.find(s => s.id === schoolId);
    if (!school) return;

    currentEditSchoolId = schoolId;
    document.getElementById('editChildName').value = school.child_name || '';
    document.getElementById('editSchoolName').value = school.school_name || '';
    document.getElementById('editSchoolAddress').value = school.address || '';
    document.getElementById('editSchoolEmail').value = (school.sender_emails && school.sender_emails[0]) || '';

    document.getElementById('editSchoolModal').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('editSchoolModal').classList.remove('show');
    currentEditSchoolId = null;
  }

  async function searchSchoolsEdit() {
    const query = document.getElementById('editSchoolName').value.trim();
    const resultsDiv = document.getElementById('editSchoolSearchResults');

    if (!query || query.length < 2) {
      resultsDiv.style.display = 'none';
      return;
    }

    try {
      const res = await fetch(`/api/school/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();

      if (!data.schools || data.schools.length === 0) {
        resultsDiv.style.display = 'none';
        return;
      }

      resultsDiv.innerHTML = data.schools.map(s => `
        <div onclick="selectSchoolEdit('${s.name.replace(/'/g, "\\'")}', '${s.address.replace(/'/g, "\\'")}')"
          style="padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;">
          <div style="font-weight: 600; font-size: 13px;">${s.name}</div>
          <div style="font-size: 11px; color: var(--muted);">${s.address || 'No address'}</div>
        </div>
      `).join('');
      resultsDiv.style.display = 'block';
    } catch (e) {
      console.error('School search error:', e);
    }
  }

  function selectSchoolEdit(name, address) {
    document.getElementById('editSchoolName').value = name;
    document.getElementById('editSchoolAddress').value = address;
    document.getElementById('editSchoolSearchResults').style.display = 'none';
  }

  async function saveEditedSchool() {
    const childName = document.getElementById('editChildName').value.trim();
    const schoolName = document.getElementById('editSchoolName').value.trim();
    const address = document.getElementById('editSchoolAddress').value.trim();
    const schoolEmail = document.getElementById('editSchoolEmail').value.trim();

    if (!childName || !schoolName) {
      alert('Please enter child name and school name');
      return;
    }

    if (schoolEmail && !schoolEmail.includes('@')) {
      alert('Please enter a valid email address');
      return;
    }

    try {
      const res = await fetch('/api/school/edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: currentEditSchoolId,
          child_name: childName,
          school_name: schoolName,
          address: address,
          sender_emails: schoolEmail ? [schoolEmail] : []
        })
      });

      const data = await res.json();
      if (res.ok) {
        alert('✓ School updated!');
        closeEditModal();
        loadSchools();
      } else {
        alert('Error: ' + (data.error || 'Failed to save'));
      }
    } catch (e) {
      console.error('Save error:', e);
      alert('Error saving school: ' + e.message);
    }
  }

  // Load on page load
  loadSchools();
  loadWeekAhead();
</script>

</body>
</html>
