<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0369a1;
            --accent: #d97706;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --surface: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f3f4f6;
                --muted: #9ca3af;
                --border: #374151;
                --bg: #111827;
                --surface: #1f2937;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-input {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .card-detail {
            font-size: 12px;
            color: var(--muted);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .merchants-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .merchant-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 13px;
        }

        .merchant-name {
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .merchant-stats {
            display: flex;
            gap: 16px;
            color: var(--muted);
            font-size: 12px;
        }

        .merchant-amount {
            color: var(--accent);
            font-weight: 600;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .location-box {
            background: var(--bg);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .location-postcode {
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .location-spend {
            font-size: 12px;
            color: var(--muted);
        }

        .category-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .category-row:last-child {
            border-bottom: none;
        }

        .category-name {
            font-weight: 500;
        }

        .category-amount {
            color: var(--accent);
            font-weight: 600;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .transaction-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 12px;
        }

        .transaction-merchant {
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .transaction-date {
            color: var(--muted);
            font-size: 11px;
            margin-right: 16px;
        }

        .transaction-amount {
            color: var(--accent);
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Shopping Dashboard</h1>
        <p class="subtitle" id="subtitle">Loading your shopping history...</p>

        <div class="filters">
            <select id="daysFilter" class="filter-input">
                <option value="7">Last 7 days</option>
                <option value="14">Last 14 days</option>
                <option value="30" selected>Last 30 days</option>
                <option value="60">Last 60 days</option>
                <option value="90">Last 90 days</option>
            </select>
            <input type="text" id="merchantFilter" class="filter-input" placeholder="Filter by merchant...">
            <button class="filter-input" onclick="resetFilters()" style="cursor: pointer;">Reset</button>
        </div>

        <div id="errorContainer"></div>

        <div class="grid" id="summaryGrid">
            <div class="card">
                <div class="card-title">Total Spent</div>
                <div class="card-value" id="totalSpent">£0.00</div>
                <div class="card-detail" id="receiptCount">0 receipts</div>
            </div>
            <div class="card">
                <div class="card-title">Top Merchant</div>
                <div class="card-value" id="topMerchant" style="font-size: 18px;">—</div>
                <div class="card-detail" id="topMerchantAmount">0 visits</div>
            </div>
            <div class="card">
                <div class="card-title">Average Spend</div>
                <div class="card-value" id="avgSpend">£0.00</div>
                <div class="card-detail" id="avgPerDay">per receipt</div>
            </div>
            <div class="card">
                <div class="card-title">Shopping Frequency</div>
                <div class="card-value" id="frequency">0</div>
                <div class="card-detail">days active</div>
            </div>
        </div>

        <div class="grid">
            <div class="card full-width">
                <div class="card-title">💰 Top Merchants</div>
                <div class="merchants-list" id="topMerchants">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card full-width">
                <div class="card-title">📍 Spending by Location</div>
                <div class="locations-grid" id="locations">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card full-width">
                <div class="card-title">🏷️ By Category</div>
                <div id="categories">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card full-width">
                <div class="card-title">📋 Recent Transactions</div>
                <div class="transactions-list" id="transactions">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const daysFilter = document.getElementById('daysFilter');
        const merchantFilter = document.getElementById('merchantFilter');

        daysFilter.addEventListener('change', loadDashboard);
        merchantFilter.addEventListener('input', loadDashboard);

        function resetFilters() {
            daysFilter.value = 30;
            merchantFilter.value = '';
            loadDashboard();
        }

        async function loadDashboard() {
            const days = daysFilter.value;
            const merchant = merchantFilter.value.toLowerCase();
            const token = getToken();

            try {
                const url = `/api/shopping-history?days=${days}&limit=1000${token ? `&token=${encodeURIComponent(token)}` : ''}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.receipts || data.receipts.length === 0) {
                    document.getElementById('errorContainer').innerHTML = '<div class="error">No shopping history found.</div>';
                    return;
                }

                // Filter by merchant if provided
                let receipts = data.receipts;
                if (merchant) {
                    receipts = receipts.filter(r => r.merchant.toLowerCase().includes(merchant));
                }

                renderDashboard(receipts, days);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('errorContainer').innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }

        function renderDashboard(receipts, days) {
            // Summary
            const totalSpent = receipts.reduce((sum, r) => sum + (r.amount || 0), 0);
            const uniqueDates = new Set(receipts.map(r => r.shop_date));
            const avgSpend = receipts.length > 0 ? (totalSpent / receipts.length) : 0;

            document.getElementById('totalSpent').textContent = `£${totalSpent.toFixed(2)}`;
            document.getElementById('receiptCount').textContent = `${receipts.length} receipts`;
            document.getElementById('avgSpend').textContent = `£${avgSpend.toFixed(2)}`;
            document.getElementById('frequency').textContent = uniqueDates.size;
            document.getElementById('subtitle').textContent = `Last ${days} days • ${totalSpent.toFixed(2)} spent`;

            // Top merchants
            const merchantTotals = {};
            const merchantVisits = {};
            receipts.forEach(r => {
                const m = r.merchant;
                merchantTotals[m] = (merchantTotals[m] || 0) + r.amount;
                merchantVisits[m] = (merchantVisits[m] || 0) + 1;
            });

            const topMerchantName = Object.keys(merchantTotals).sort((a, b) => merchantTotals[b] - merchantTotals[a])[0];
            document.getElementById('topMerchant').textContent = topMerchantName || '—';
            document.getElementById('topMerchantAmount').textContent = `${merchantVisits[topMerchantName] || 0} visits • £${(merchantTotals[topMerchantName] || 0).toFixed(2)}`;

            const merchantsHtml = Object.entries(merchantTotals)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(([name, total]) => `
                    <div class="merchant-row">
                        <div class="merchant-name">${name}</div>
                        <div class="merchant-stats">
                            <span>${merchantVisits[name] || 1}x</span>
                            <span class="merchant-amount">£${total.toFixed(2)}</span>
                        </div>
                    </div>
                `).join('');
            document.getElementById('topMerchants').innerHTML = merchantsHtml || '<div class="loading">No data</div>';

            // Spending by location
            const locationTotals = {};
            receipts.forEach(r => {
                const loc = r.postcode || r.location || 'Unknown';
                locationTotals[loc] = (locationTotals[loc] || 0) + r.amount;
            });

            const locationsHtml = Object.entries(locationTotals)
                .sort((a, b) => b[1] - a[1])
                .map(([loc, total]) => `
                    <div class="location-box">
                        <div class="location-postcode">${loc}</div>
                        <div class="location-spend">£${total.toFixed(2)}</div>
                    </div>
                `).join('');
            document.getElementById('locations').innerHTML = locationsHtml || '<div class="loading">No data</div>';

            // By category
            const categoryTotals = {};
            receipts.forEach(r => {
                const cat = r.category || 'Other';
                categoryTotals[cat] = (categoryTotals[cat] || 0) + r.amount;
            });

            const categoryIcons = {
                'Coffee & Lunch': '☕',
                'Groceries': '🛒',
                'Dining': '🍽️',
                'Takeaway': '🥡',
                'Fuel': '⛽',
                'Shopping': '🛍️',
                'Other': '📌'
            };

            const categoriesHtml = Object.entries(categoryTotals)
                .sort((a, b) => b[1] - a[1])
                .map(([cat, total]) => `
                    <div class="category-row">
                        <span class="category-name">${categoryIcons[cat] || '•'} ${cat}</span>
                        <span class="category-amount">£${total.toFixed(2)}</span>
                    </div>
                `).join('');
            document.getElementById('categories').innerHTML = categoriesHtml || '<div class="loading">No data</div>';

            // Recent transactions
            const transactionsHtml = receipts
                .slice(0, 20)
                .map(r => `
                    <div class="transaction-row">
                        <div class="transaction-merchant">${r.merchant}</div>
                        <div class="transaction-date">${r.shop_date}</div>
                        <div class="transaction-amount">£${r.amount.toFixed(2)}</div>
                    </div>
                `).join('');
            document.getElementById('transactions').innerHTML = transactionsHtml || '<div class="loading">No data</div>';
        }

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token') || localStorage.getItem('miru_saves_token') || localStorage.getItem('miru_saves_phone');
        }

        // Initial load
        loadDashboard();
    </script>
</body>
</html>
