<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Brand Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .search-section {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        select {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button {
            padding: 14px 28px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        .suggestions {
            margin-top: 20px;
        }

        .suggestion-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .suggestion-btn {
            padding: 8px 12px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .stat {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .search-section {
                padding: 30px 20px;
            }

            .search-box {
                flex-direction: column;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎯 Intel Phase 1</h1>
        <p class="subtitle">Search 60 Real Brand-Market Records</p>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="brandInput" placeholder="Search brand (e.g., Dove, Pepsi, Olay)" autocomplete="off">
                <select id="marketSelect">
                    <option value="UK">UK</option>
                    <option value="USA">USA</option>
                    <option value="India">India</option>
                </select>
                <button onclick="search()">Search</button>
            </div>

            <div id="error" class="error"></div>

            <div class="suggestions">
                <div class="suggestion-title">Popular Brands</div>
                <div class="suggestion-grid">
                    <button class="suggestion-btn" onclick="searchBrand('Dove')">Dove</button>
                    <button class="suggestion-btn" onclick="searchBrand('Pepsi')">Pepsi</button>
                    <button class="suggestion-btn" onclick="searchBrand('Olay')">Olay</button>
                    <button class="suggestion-btn" onclick="searchBrand('Sprite')">Sprite</button>
                    <button class="suggestion-btn" onclick="searchBrand('CeraVe')">CeraVe</button>
                    <button class="suggestion-btn" onclick="searchBrand('Monster')">Monster</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value">60</div>
                    <div class="stat-label">Records</div>
                </div>
                <div class="stat">
                    <div class="stat-value">20</div>
                    <div class="stat-label">Brands</div>
                </div>
                <div class="stat">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Markets</div>
                </div>
                <div class="stat">
                    <div class="stat-value">89%</div>
                    <div class="stat-label">Confidence</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function searchBrand(name) {
            document.getElementById('brandInput').value = name;
            search();
        }

        function search() {
            const brand = document.getElementById('brandInput').value.trim();
            const market = document.getElementById('marketSelect').value;
            const error = document.getElementById('error');

            if (!brand) {
                error.textContent = 'Please enter a brand name';
                return;
            }

            error.textContent = '';
            window.location.href = `/brand/full?search=${encodeURIComponent(brand)}&market=${market}`;
        }

        document.getElementById('brandInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });

        // Auto-focus input
        document.getElementById('brandInput').focus();
    </script>
</body>
</html>
