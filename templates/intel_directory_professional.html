<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel — Brand Intelligence Directory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 70px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.85;
            font-weight: 300;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* Search Section */
        .search-section {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 50px;
            border: 1px solid #e2e8f0;
        }

        .search-mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 2px solid #e2e8f0;
        }

        .mode-tab {
            padding: 14px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            color: #64748b;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .mode-tab.active {
            color: #0f172a;
            border-bottom-color: #3b82f6;
        }

        .mode-tab:hover {
            color: #1e293b;
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: white;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .autocomplete-list.active {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .autocomplete-item:hover {
            background: #f8fafc;
        }

        .autocomplete-item-main {
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }

        .autocomplete-item-meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Results */
        .results-section {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none;
            border: 1px solid #e2e8f0;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
        }

        .results-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
        }

        .results-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            padding: 10px 18px;
            font-size: 13px;
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .action-btn:hover {
            background: #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .brand-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .brand-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .brand-card:hover {
            background: white;
            border-color: #3b82f6;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
            transform: translateY(-4px);
        }

        .brand-card:hover::before {
            opacity: 1;
        }

        .brand-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .brand-meta {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }

        .brand-meta-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .empty-text {
            font-size: 15px;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 14px;
            margin-top: 60px;
        }

        .stats-bar {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #f0f4f8 0%, #f8fafc 100%);
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
        }

        .stat {
            flex: 1;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .email-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .email-modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }

        .modal-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px 16px;
        }

        .modal-actions button:last-child {
            background: #e2e8f0;
            color: #1e293b;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>📊 Intel Brand Intelligence</h1>
        <p class="subtitle">Search & analyze brands by company, category, or name</p>
    </header>

    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <!-- Mode Tabs -->
            <div class="search-mode-tabs">
                <button class="mode-tab active" onclick="switchMode('company')">🏢 By Company</button>
                <button class="mode-tab" onclick="switchMode('category')">📁 By Category</button>
                <button class="mode-tab" onclick="switchMode('brand')">🏷️ By Brand</button>
            </div>

            <!-- Company Mode -->
            <div id="company-mode" class="mode-content active">
                <div class="search-box">
                    <div class="search-input-wrapper" style="flex: 1;">
                        <input type="text" id="companyInput" placeholder="Search companies... (Mars, Nestlé, PepsiCo)" oninput="filterCompanies()">
                        <div class="autocomplete-list" id="companyList"></div>
                    </div>
                </div>
            </div>

            <!-- Category Mode -->
            <div id="category-mode" class="mode-content">
                <div class="search-box">
                    <select id="categorySelect" onchange="searchByCategory()" style="flex: 1;">
                        <option value="">Select a category...</option>
                        <option value="skincare">💄 Skincare</option>
                        <option value="beverages">🥤 Beverages</option>
                        <option value="snacks">🍿 Snacks</option>
                        <option value="qsr">🍔 Quick Service Restaurants</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>
            </div>

            <!-- Brand Mode -->
            <div id="brand-mode" class="mode-content">
                <div class="search-box">
                    <div class="search-input-wrapper" style="flex: 1;">
                        <input type="text" id="brandInput" placeholder="Search brands... (Nutella, Tesla, Nike)" oninput="searchBrandName()">
                        <div class="autocomplete-list" id="brandList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section">
            <div class="results-header">
                <div class="results-title" id="resultsTitle"></div>
                <div class="results-actions">
                    <button class="action-btn" onclick="downloadPDF()">📥 PDF</button>
                    <button class="action-btn primary" onclick="showEmailModal()">📧 Email</button>
                </div>
            </div>

            <div id="statsBar" class="stats-bar" style="display: none;">
                <div class="stat">
                    <div class="stat-value" id="statBrands">0</div>
                    <div class="stat-label">Brands</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statCategories">0</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statMarkets">0</div>
                    <div class="stat-label">Markets</div>
                </div>
            </div>

            <div class="brands-grid" id="brandsList"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            ✨ Download results as PDF or email them to yourself for later review
        </div>
    </div>

    <!-- Email Modal -->
    <div id="emailModal" class="email-modal">
        <div class="modal-content">
            <div class="modal-title">📧 Email Results</div>
            <input type="email" id="emailInput" class="modal-input" placeholder="Enter your email address">
            <div class="modal-actions">
                <button onclick="sendEmail()">Send</button>
                <button onclick="closeEmailModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let allCompanies = [];
        let allBrands = [];
        let selectedMode = 'company';
        let currentResults = [];
        let currentQuery = '';

        async function loadCompanies() {
            try {
                const response = await fetch('/api/intel/companies');
                const data = await response.json();
                allCompanies = data.companies || [];
            } catch (error) {
                console.error('Error loading companies:', error);
            }
        }

        async function loadBrands() {
            try {
                const response = await fetch('/api/brands/search?q=');
                allBrands = await response.json();
            } catch (error) {
                console.error('Error loading brands:', error);
            }
        }

        function switchMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.mode-content').forEach(content => content.classList.remove('active'));
            document.getElementById(mode + '-mode').classList.add('active');
            document.getElementById('resultsSection').style.display = 'none';
            clearAutocomplete();
        }

        function clearAutocomplete() {
            document.getElementById('companyList').classList.remove('active');
            document.getElementById('brandList').classList.remove('active');
        }

        function filterCompanies() {
            const query = document.getElementById('companyInput').value.toLowerCase();
            const list = document.getElementById('companyList');
            if (!query) {
                list.classList.remove('active');
                return;
            }
            const filtered = allCompanies.filter(c => c.name.toLowerCase().includes(query)).slice(0, 10);
            if (filtered.length === 0) {
                list.classList.remove('active');
                return;
            }
            list.innerHTML = filtered.map(c => `
                <div class="autocomplete-item" onclick="selectCompany('${c.name.replace(/'/g, "\\'")}')">
                    <div class="autocomplete-item-main">${escapeHtml(c.name)}</div>
                    <div class="autocomplete-item-meta">🏷️ ${c.brand_count} brands</div>
                </div>
            `).join('');
            list.classList.add('active');
        }

        async function selectCompany(companyName) {
            document.getElementById('companyInput').value = companyName;
            clearAutocomplete();
            currentQuery = companyName;
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.style.display = 'block';
            document.getElementById('resultsTitle').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const response = await fetch(`/api/intel/company/${encodeURIComponent(companyName)}`);
                const data = await response.json();
                if (!data.brands || data.brands.length === 0) {
                    document.getElementById('resultsTitle').innerHTML = `No brands found`;
                    document.getElementById('brandsList').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No results</div></div>';
                    return;
                }
                currentResults = data.brands;
                document.getElementById('resultsTitle').innerHTML = `${escapeHtml(companyName)} — ${data.brand_count} brands`;
                displayResults(data.brands);
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('resultsTitle').innerHTML = 'Error loading';
            }
        }

        async function searchByCategory() {
            const category = document.getElementById('categorySelect').value;
            if (!category) return;
            currentQuery = category;
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.style.display = 'block';
            document.getElementById('resultsTitle').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const response = await fetch(`/api/intel/category/${encodeURIComponent(category)}`);
                const data = await response.json();
                if (!data.brands || data.brands.length === 0) {
                    document.getElementById('resultsTitle').innerHTML = `No brands found`;
                    return;
                }
                currentResults = data.brands;
                document.getElementById('resultsTitle').innerHTML = `${category.charAt(0).toUpperCase() + category.slice(1)} — ${data.brands.length} brands`;
                displayResults(data.brands);
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('resultsTitle').innerHTML = 'Error loading';
            }
        }

        async function searchBrandName() {
            const query = document.getElementById('brandInput').value.trim();
            const list = document.getElementById('brandList');
            if (!query || query.length < 2) {
                list.classList.remove('active');
                return;
            }
            try {
                const response = await fetch(`/api/brands/search?q=${encodeURIComponent(query)}`);
                const brands = await response.json();
                if (brands.length === 0) {
                    list.classList.remove('active');
                    return;
                }
                list.innerHTML = brands.slice(0, 10).map(b => `
                    <div class="autocomplete-item" onclick="goToBrand('${b.name.replace(/'/g, "\\'")}')">
                        <div class="autocomplete-item-main">${escapeHtml(b.name)}</div>
                        <div class="autocomplete-item-meta">📁 ${b.category}</div>
                    </div>
                `).join('');
                list.classList.add('active');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function goToBrand(brandName) {
            window.location.href = `/brand/full?search=${encodeURIComponent(brandName)}&market=UK`;
        }

        function displayResults(brands) {
            const categories = new Set(brands.map(b => b.category));
            const markets = new Set();
            brands.forEach(b => {
                if (b.markets) b.markets.forEach(m => markets.add(m));
            });

            document.getElementById('statBrands').textContent = brands.length;
            document.getElementById('statCategories').textContent = categories.size;
            document.getElementById('statMarkets').textContent = markets.size;
            document.getElementById('statsBar').style.display = 'flex';

            const brandsList = document.getElementById('brandsList');
            brandsList.innerHTML = brands.map(brand => `
                <div class="brand-card" onclick="goToBrand('${brand.name.replace(/'/g, "\\'")}')">
                    <div class="brand-name">${escapeHtml(brand.name)}</div>
                    <div class="brand-meta">
                        <div class="brand-meta-item">📁 ${brand.category || 'N/A'}</div>
                        ${brand.positioning_tier ? `<div class="brand-meta-item">🎯 ${brand.positioning_tier}</div>` : ''}
                        ${brand.markets ? `<div class="brand-meta-item">📍 ${brand.markets.join(', ')}</div>` : ''}
                        ${brand.parent_company ? `<div class="brand-meta-item">🏢 ${brand.parent_company}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function downloadPDF() {
            if (!currentResults.length) return;

            const element = document.createElement('div');
            element.innerHTML = `
                <h2 style="margin-bottom: 20px;">Intel Brand Report</h2>
                <p style="margin-bottom: 20px;">Query: ${escapeHtml(currentQuery)}</p>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                    <tr style="background: #f0f0f0;">
                        <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Brand</th>
                        <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Category</th>
                        <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Company</th>
                        <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">Markets</th>
                    </tr>
                    ${currentResults.map(b => `
                        <tr>
                            <td style="border: 1px solid #ddd; padding: 10px;">${escapeHtml(b.name)}</td>
                            <td style="border: 1px solid #ddd; padding: 10px;">${b.category || 'N/A'}</td>
                            <td style="border: 1px solid #ddd; padding: 10px;">${b.parent_company || 'N/A'}</td>
                            <td style="border: 1px solid #ddd; padding: 10px;">${b.markets ? b.markets.join(', ') : 'N/A'}</td>
                        </tr>
                    `).join('')}
                </table>
            `;

            const opt = {
                margin: 10,
                filename: `intel-brands-${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function showEmailModal() {
            document.getElementById('emailModal').classList.add('active');
            document.getElementById('emailInput').focus();
        }

        function closeEmailModal() {
            document.getElementById('emailModal').classList.remove('active');
        }

        async function sendEmail() {
            const email = document.getElementById('emailInput').value.trim();
            if (!email) {
                alert('Please enter an email address');
                return;
            }

            const button = event.target;
            button.disabled = true;
            button.textContent = 'Sending...';

            try {
                const response = await fetch('/api/intel/email-brands', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        query: currentQuery,
                        brands: currentResults,
                        count: currentResults.length
                    })
                });

                const data = await response.json();
                if (data.success) {
                    alert('✅ Results sent to ' + email);
                    closeEmailModal();
                } else {
                    alert('❌ Failed to send email: ' + data.error);
                }
            } catch (error) {
                alert('Error sending email: ' + error.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Send';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCompanies();
            loadBrands();
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-input-wrapper')) {
                clearAutocomplete();
            }
        });
    </script>
</body>
</html>
