<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Creative Tracker - Rexona x FIFA World Cup 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a1a; }
        .header { background: white; border-bottom: 1px solid #e5e7eb; padding: 20px 40px; }
        .header h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 14px; color: #666; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }
        .section { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; border: 1px solid #e5e7eb; }
        .section h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .metric-box { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
        .metric-value { font-size: 28px; font-weight: 700; color: #2563eb; }
        .metric-label { font-size: 12px; color: #666; margin-top: 8px; }

        .creative-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .creative-card { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .creative-thumbnail { width: 100%; height: 140px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
        .creative-info { padding: 16px; }
        .creative-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .creative-stats { font-size: 12px; color: #666; }

        .tweets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .tweet-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
        .tweet-author { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
        .tweet-text { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
        .tweet-sentiment { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px; background: #e8f5e9; color: #2e7d32; }

        .variants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .variant-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
        .variant-brand { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .variant-region { font-size: 11px; color: #2563eb; font-weight: 600; }
        .variant-tagline { font-size: 12px; color: #666; margin-top: 8px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .chart-container { background: white; border-radius: 8px; padding: 24px; border: 1px solid #e5e7eb; }
        .chart-wrapper { position: relative; height: 250px; }

        @media (max-width: 1024px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Campaign Creative Tracker</h1>
        <p>Rexona x FIFA World Cup 2026 — sponsorship activation intelligence</p>
    </div>

    <div class="container">
        <!-- Metrics -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-value" id="total-views">—</div>
                <div class="metric-label">Total Views</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="total-likes">—</div>
                <div class="metric-label">Total Likes</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="total-comments">—</div>
                <div class="metric-label">Total Comments</div>
            </div>
            <div class="metric-box">
                <div class="metric-value" id="avg-sentiment">—</div>
                <div class="metric-label">Avg Sentiment</div>
            </div>
        </div>

        <!-- Creatives -->
        <div class="section">
            <h2>Campaign Creatives</h2>
            <div class="creative-gallery" id="creatives"></div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-container">
                <h3>Sentiment Timeline</h3>
                <div class="chart-wrapper"><canvas id="sentimentChart"></canvas></div>
            </div>
            <div class="chart-container">
                <h3>Performance by Region</h3>
                <div class="chart-wrapper"><canvas id="regionChart"></canvas></div>
            </div>
        </div>

        <!-- Tweets -->
        <div class="section">
            <h2>Campaign Sentiment</h2>
            <div class="tweets-grid" id="tweets"></div>
        </div>

        <!-- Variants -->
        <div class="section">
            <h2>Regional Variants</h2>
            <div class="variants-grid" id="variants"></div>
        </div>
    </div>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/campaign/rexona');
                const data = await res.json();

                if (data.creatives) displayCreatives(data.creatives);
                if (data.sentiment) displaySentiment(data.sentiment);
                if (data.metrics) displayMetrics(data.creatives || [], data.sentiment || [], data.metrics);
                if (data.variants) displayVariants(data.variants);
            } catch (e) {
                console.error('Error:', e);
            }
        }

        function displayMetrics(creatives, sentiments, metrics) {
            const views = creatives.reduce((s, c) => s + (c.views || 0), 0);
            const likes = creatives.reduce((s, c) => s + (c.likes || 0), 0);
            const comments = creatives.reduce((s, c) => s + (c.comments || 0), 0);
            const avgSent = sentiments.length ? (sentiments.reduce((s, x) => s + (x.sentiment_score || 0), 0) / sentiments.length).toFixed(2) : 0;

            document.getElementById('total-views').textContent = (views / 1000000).toFixed(1) + 'M';
            document.getElementById('total-likes').textContent = (likes / 1000).toFixed(0) + 'K';
            document.getElementById('total-comments').textContent = (comments / 1000).toFixed(1) + 'K';
            document.getElementById('avg-sentiment').textContent = avgSent;

            if (metrics.length) {
                const sorted = metrics.sort((a, b) => new Date(a.date) - new Date(b.date));
                new Chart(document.getElementById('sentimentChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: sorted.map(m => m.date),
                        datasets: [{
                            label: 'Sentiment',
                            data: sorted.map(m => m.sentiment_avg),
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.05)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });

                const regions = {};
                metrics.forEach(m => {
                    regions[m.region] = (regions[m.region] || 0) + m.impressions;
                });
                new Chart(document.getElementById('regionChart').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(regions),
                        datasets: [{ data: Object.values(regions), backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        function displayCreatives(data) {
            document.getElementById('creatives').innerHTML = data.map(c => `
                <div class="creative-card">
                    <div class="creative-thumbnail">${c.platform.toUpperCase()}</div>
                    <div class="creative-info">
                        <div class="creative-title">${c.title}</div>
                        <div class="creative-stats">
                            👁 ${(c.views / 1000000).toFixed(1)}M | 👍 ${(c.likes / 1000).toFixed(0)}K | 💬 ${(c.comments / 1000).toFixed(1)}K
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function displaySentiment(data) {
            document.getElementById('tweets').innerHTML = data.map(s => {
                const sent = s.sentiment_score > 0.5 ? 'Positive' : s.sentiment_score < -0.5 ? 'Negative' : 'Neutral';
                return `
                    <div class="tweet-card">
                        <div class="tweet-author">${s.author}</div>
                        <div class="tweet-text">"${s.text}"</div>
                        <div><span class="tweet-sentiment">${sent}</span></div>
                    </div>
                `;
            }).join('');
        }

        function displayVariants(data) {
            document.getElementById('variants').innerHTML = data.map(v => `
                <div class="variant-card">
                    <div class="variant-brand">${v.brand_name}</div>
                    <div class="variant-region">${v.region}</div>
                    <div class="variant-tagline"><strong>${v.tagline}</strong></div>
                    <div class="variant-tagline">${v.messaging_angle}</div>
                </div>
            `).join('');
        }

        window.addEventListener('load', load);
        setInterval(load, 60000);
    </script>
</body>
</html>
