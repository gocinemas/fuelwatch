<!DOCTYPE html>
<html>
<head>
    <title>Add Receipt — Miru</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .amount-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .amount-input input {
            flex: 1;
        }

        .currency {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-weight: 600;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn {
            background: #667eea;
            color: white;
        }

        .submit-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .cancel-btn {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .cancel-btn:hover {
            background: #efefef;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📝 Add Receipt</h1>
            <p class="subtitle">Missed scanning? Add your receipt manually here</p>

            <div class="success-message" id="successMsg">✅ Receipt added successfully!</div>
            <div class="error-message" id="errorMsg"></div>

            <form id="receiptForm" onsubmit="submitReceipt(event)">
                <div class="form-group">
                    <label for="merchant">Merchant Name *</label>
                    <input
                        type="text"
                        id="merchant"
                        name="merchant"
                        placeholder="e.g. Costa Coffee, Tesco, Pret"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Virginia Water, King's Road"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount *</label>
                    <div class="amount-input">
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            step="0.01"
                            min="0"
                            required
                        >
                        <div class="currency">£</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="items">Items</label>
                    <textarea
                        id="items"
                        name="items"
                        placeholder="e.g.&#10;Flat White&#10;Croissant"
                    ></textarea>
                    <div class="hint">One item per line (optional)</div>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                    >
                    <div class="hint">Defaults to today if not set</div>
                </div>

                <div class="button-group">
                    <button type="button" class="cancel-btn" onclick="resetForm()">Cancel</button>
                    <button type="submit" class="submit-btn">Add Receipt</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Set date to today
        document.getElementById('date').valueAsDate = new Date();

        async function submitReceipt(event) {
            event.preventDefault();

            const merchant = document.getElementById('merchant').value;
            const location = document.getElementById('location').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const items = document.getElementById('items').value
                .split('\n')
                .map(i => i.trim())
                .filter(i => i);
            const date = document.getElementById('date').value;

            try {
                const response = await fetch('/api/receipts/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        merchant,
                        location,
                        amount,
                        items,
                        date
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess();
                    resetForm();
                } else {
                    showError(data.error || 'Failed to add receipt');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }

        function showSuccess() {
            const msg = document.getElementById('successMsg');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function showError(message) {
            const msg = document.getElementById('errorMsg');
            msg.textContent = '❌ ' + message;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 5000);
        }

        function resetForm() {
            document.getElementById('receiptForm').reset();
            document.getElementById('date').valueAsDate = new Date();
        }
    </script>
</body>
</html>
