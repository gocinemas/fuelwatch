<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 Ideas Database - Find Your Next Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            border-bottom: 1px solid #334155;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 18px;
            color: #94a3b8;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #334155;
            border-color: #60a5fa;
            color: #60a5fa;
        }

        /* Ideas Grid */
        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Idea Card */
        .idea-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        .idea-card:hover {
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
            transform: translateY(-4px);
        }

        .idea-emoji { font-size: 32px; margin-bottom: 8px; }
        .idea-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1f5f9;
        }
        .idea-description {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 16px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .idea-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
            font-size: 12px;
        }
        .idea-category {
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            color: #94a3b8;
        }
        .idea-tam {
            color: #60a5fa;
            font-weight: 600;
        }

        .idea-scores {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .score-badge {
            flex: 1;
            text-align: center;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #60a5fa;
        }
        .score-label {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .score-value {
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
        }

        .idea-verdict {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(96, 165, 250, 0.1);
            border-radius: 6px;
        }

        .idea-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #334155;
            border-color: #60a5fa;
            color: #60a5fa;
        }
        .btn-save {
            color: #fbbf24;
        }
        .btn-save:hover {
            color: #fbbf24;
            border-color: #fbbf24;
        }
        .btn-save.saved {
            background: #fbbf24;
            color: #000;
            border-color: #fbbf24;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            padding: 32px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #e2e8f0; }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            margin: 20px 0;
            color: #f1f5f9;
        }
        .modal-section {
            margin: 20px 0;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        .modal-section h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
        .modal-section p {
            font-size: 14px;
            line-height: 1.6;
            color: #94a3b8;
        }

        .gtm-steps {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
        }
        .gtm-steps li {
            margin-left: 20px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 32px; }
            .ideas-grid { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💡 Ideas Database</h1>
            <p>50+ curated app ideas with competitive analysis + GTM playbooks</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="total-ideas">50</div>
                <div class="stat-label">Curated Ideas</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">$200M-5B</div>
                <div class="stat-label">Total TAM</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="saved-count">0</div>
                <div class="stat-label">Your Saved Ideas</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterIdeas()">All Ideas</button>
            <button class="filter-btn" onclick="filterIdeas('SaaS B2B')">SaaS B2B</button>
            <button class="filter-btn" onclick="filterIdeas('SaaS B2C')">SaaS B2C</button>
            <button class="filter-btn" onclick="filterIdeas('Mobile App')">Mobile Apps</button>
            <button class="filter-btn" onclick="filterIdeas('Marketplace')">Marketplaces</button>
            <button class="filter-btn" onclick="filterIdeas('AI Tool')">AI Tools</button>
            <button class="filter-btn" onclick="filterIdeas(null, 70)">Strong Defensibility</button>
            <button class="filter-btn" onclick="showSavedIdeas()">📌 My Saved</button>
        </div>

        <!-- Ideas Grid -->
        <div class="ideas-grid" id="ideas-grid"></div>

        <!-- Modal -->
        <div class="modal" id="detail-modal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">×</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        const phoneNumber = localStorage.getItem('miru_phone') || 'guest';
        let allIdeas = [];
        let currentFilter = null;

        // Load ideas on page load
        async function loadIdeas() {
            try {
                const response = await fetch('/api/ideas');
                const data = await response.json();
                allIdeas = data.ideas;
                document.getElementById('total-ideas').textContent = data.count;
                renderIdeas(allIdeas);
                loadSavedIdeas();
            } catch (e) {
                console.error('Error loading ideas:', e);
            }
        }

        async function filterIdeas(category = null, defensibility = null) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            try {
                let url = '/api/ideas';
                if (category) url += `?category=${category}`;
                if (defensibility) url += `?defensibility_min=${defensibility}`;

                const response = await fetch(url);
                const data = await response.json();
                renderIdeas(data.ideas);
            } catch (e) {
                console.error('Error filtering:', e);
            }
        }

        function renderIdeas(ideas) {
            const grid = document.getElementById('ideas-grid');
            grid.innerHTML = ideas.map(idea => `
                <div class="idea-card" onclick="showDetail('${idea.id}')">
                    <div class="idea-emoji">${getEmojiForCategory(idea.category)}</div>
                    <div class="idea-name">${idea.name}</div>
                    <div class="idea-description">${idea.description}</div>

                    <div class="idea-meta">
                        <span class="idea-category">${idea.category}</span>
                        <span class="idea-tam">${idea.tam}</span>
                    </div>

                    <div class="idea-scores">
                        <div class="score-badge">
                            <div class="score-label">Defensibility</div>
                            <div class="score-value">${idea.defensibility_score}</div>
                        </div>
                        <div class="score-badge">
                            <div class="score-label">Risk</div>
                            <div class="score-value">${getRiskScore(idea.risk_level)}</div>
                        </div>
                    </div>

                    <div class="idea-verdict">${idea.verdict}</div>

                    <div class="idea-actions">
                        <button class="btn" onclick="event.stopPropagation(); viewIdea('${idea.id}')">View</button>
                        <button class="btn btn-save" id="save-${idea.id}" onclick="event.stopPropagation(); saveIdea('${idea.id}', '${idea.name}')">💾 Save</button>
                    </div>
                </div>
            `).join('');

            loadSavedIdeas();
        }

        async function showDetail(ideaId) {
            try {
                const response = await fetch(`/api/ideas/${ideaId}`);
                const data = await response.json();
                const idea = data.idea;

                const modal = document.getElementById('detail-modal');
                const body = document.getElementById('modal-body');

                body.innerHTML = `
                    <div class="modal-title">${getEmojiForCategory(idea.category)} ${idea.name}</div>

                    <div class="modal-section">
                        <h3>📝 Overview</h3>
                        <p>${idea.description}</p>
                    </div>

                    <div class="modal-section">
                        <h3>💰 Market Size</h3>
                        <p><strong>TAM:</strong> ${idea.tam}</p>
                        <p><strong>Estimated Size:</strong> ${idea.estimated_tam}</p>
                    </div>

                    <div class="modal-section">
                        <h3>🏆 Competitive Landscape</h3>
                        <p><strong>Competitors:</strong> ${idea.competitors.join(', ')}</p>
                        <p><strong>Defensibility:</strong> ${idea.defensibility_level} (${idea.defensibility_score}/100)</p>
                        <p>${idea.defensibility_reason}</p>
                    </div>

                    <div class="modal-section">
                        <h3>🎯 Differentiation</h3>
                        <p>${idea.key_differentiator}</p>
                    </div>

                    <div class="modal-section">
                        <h3>📅 90-Day GTM Roadmap</h3>
                        <p>${idea.gtm_playbook}</p>
                        <div class="gtm-steps">
                            <strong>Winning Signal in 90 Days:</strong><br>
                            ${idea.winning_signal}
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3>🔍 Assessment</h3>
                        <p><strong>Verdict:</strong> ${idea.verdict}</p>
                        <p><strong>Reasoning:</strong> ${idea.verdict_reason}</p>
                        <p><strong>Risk Level:</strong> ${idea.risk_level}</p>
                        <p><strong>Moat Potential:</strong> ${idea.moat_potential}</p>
                    </div>

                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #334155;">
                        <button class="btn" onclick="closeModal()" style="width: 100%;">Close</button>
                    </div>
                `;

                modal.classList.add('active');
            } catch (e) {
                console.error('Error loading detail:', e);
            }
        }

        function viewIdea(ideaId) {
            showDetail(ideaId);
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        async function saveIdea(ideaId, ideaName) {
            try {
                await fetch(`/api/ideas/${ideaId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from_number: phoneNumber })
                });

                const btn = document.getElementById(`save-${ideaId}`);
                btn.classList.add('saved');
                btn.textContent = '✅ Saved';
                loadSavedIdeas();
            } catch (e) {
                console.error('Error saving idea:', e);
            }
        }

        async function loadSavedIdeas() {
            try {
                const response = await fetch(`/api/ideas/my-saved?from_number=${phoneNumber}`);
                const data = await response.json();

                // Update saved buttons
                data.saved_ideas?.forEach(idea => {
                    const btn = document.getElementById(`save-${idea.id}`);
                    if (btn) {
                        btn.classList.add('saved');
                        btn.textContent = '✅ Saved';
                    }
                });

                document.getElementById('saved-count').textContent = data.count || 0;
            } catch (e) {
                console.error('Error loading saved:', e);
            }
        }

        async function showSavedIdeas() {
            try {
                const response = await fetch(`/api/ideas/my-saved?from_number=${phoneNumber}`);
                const data = await response.json();
                renderIdeas(data.saved_ideas || []);
            } catch (e) {
                console.error('Error showing saved:', e);
            }
        }

        function getEmojiForCategory(category) {
            const emojis = {
                'SaaS B2B': '🏢',
                'SaaS B2C': '👤',
                'Mobile App': '📱',
                'Marketplace': '🛍️',
                'AI Tool': '🤖',
                'Developer Tool': '👨‍💻',
                'Community': '👥'
            };
            return emojis[category] || '💡';
        }

        function getRiskScore(riskLevel) {
            const scores = {
                'LOW': 80,
                'MEDIUM': 60,
                'MEDIUM-HIGH': 50,
                'HIGH': 30
            };
            return scores[riskLevel] || 50;
        }

        // Load on page load
        window.addEventListener('load', loadIdeas);
    </script>
</body>
</html>
