<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📚 My Books</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h1{margin:0 0 8px 0;font-size:28px;color:#1f2937}
.subtitle{font-size:14px;color:#9ca3af;margin-bottom:24px}
.tab-strip{display:flex;gap:8px;margin-bottom:18px}
.tab-btn{padding:8px 16px;border-radius:20px;border:1.5px solid #e5e7eb;background:#f3f4f6;color:#9ca3af;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.tab-btn.active{background:#1f2937;color:#fff;border-color:#1f2937}
.panel{display:none}
.panel.active{display:block}
.input-group{display:flex;gap:8px;margin-bottom:10px}
.input-group input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;color:#1f2937;font-size:15px}
.input-group button{padding:11px 18px;border-radius:12px;border:none;background:#1f2937;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.scanner-btn{display:block;width:100%;padding:11px;border-radius:12px;border:1.5px dashed #7c3aed;background:#f5f3ff;color:#6d28d9;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px}
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:16px;font-weight:700;color:#1f2937;margin-bottom:8px}
.empty-text{font-size:13px;color:#9ca3af}
.book-item{padding:12px;background:#f9fafb;border-radius:8px;margin-bottom:8px;border-left:3px solid #7c3aed;cursor:pointer}
.book-item:hover{background:#f3f4f6}
.book-title{font-weight:700;color:#1f2937}
.book-author{font-size:12px;color:#9ca3af;margin-top:4px}
.book-progress{font-size:11px;color:#7c3aed;margin-top:6px}
.instructions{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:11px 13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#166534;line-height:1.5}
.instructions span{font-size:18px;flex-shrink:0}
code{background:#dcfce7;padding:1px 5px;border-radius:4px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;color:#1f2937;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:4px}
.form-input{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;box-sizing:border-box}
.form-buttons{display:flex;gap:8px;margin-top:16px}
.form-buttons button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:600;cursor:pointer}
.btn-save{background:#1f2937;color:#fff}
.btn-cancel{background:#e5e7eb;color:#1f2937}
.btn-delete{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="container">
<h1>📚 My Books</h1>
<div class="subtitle">Search, scan barcodes, track your reading</div>

<!-- Tabs -->
<div class="tab-strip">
<button class="tab-btn active" onclick="libTab('search', this)">🔍 Find Books</button>
<button class="tab-btn" onclick="libTab('library', this)">📚 My Library</button>
</div>

<!-- Search Panel -->
<div id="search-panel" class="panel active">
<div class="input-group">
<input id="book-input" type="text" placeholder="Title, author or ISBN…" onkeydown="if(event.key==='Enter')bookSearch()">
<button onclick="bookSearch()">Search</button>
</div>

<button class="scanner-btn" onclick="bookToggleScanner()">📷 Scan ISBN barcode</button>
<div id="book-scan-wrap" style="display:none;margin-bottom:12px;border-radius:14px;overflow:hidden">
<div id="book-scan-reader" style="width:100%"></div>
<button onclick="bookStopScanner()" style="display:block;width:100%;padding:10px;border:none;background:#ef4444;color:#fff;font-size:13px;font-weight:700;cursor:pointer">✕ Stop scanner</button>
</div>

<div class="instructions">
<span>💬</span>
<div>
<strong>Add via WhatsApp</strong> — message Miru:<br>
<code>book the human experience</code><br>
<code>book john sills</code><br>
<code>book 9781399401739</code>
</div>
</div>

<div id="book-loading" style="display:none;text-align:center;padding:24px 0;color:#9ca3af;font-size:13px">Searching…</div>
<div id="book-error" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px;font-size:13px;color:#b91c1c;margin-bottom:10px"></div>
<div id="book-results"></div>
</div>

<!-- Library Panel -->
<div id="library-panel" class="panel">
<div id="lib-empty" class="empty">
<div class="empty-icon">📚</div>
<div class="empty-title">No books yet</div>
<div class="empty-text">Search or scan to add your first book</div>
</div>
<div id="lib-books"></div>
</div>

</div>

<!-- Book Detail Modal -->
<div id="book-modal" class="modal">
<div class="modal-content">
<div class="modal-title">📖 <span id="modal-title"></span></div>
<div class="form-group">
<label class="form-label">Status</label>
<select id="modal-status" class="form-input">
<option value="want">⭐ Want to read</option>
<option value="reading">📖 Reading</option>
<option value="completed">✓ Completed</option>
<option value="owned">📚 Own</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Pages Read</label>
<input type="number" id="modal-pages-read" class="form-input" placeholder="0">
</div>
<div class="form-group">
<label class="form-label">Total Pages</label>
<input type="number" id="modal-pages-total" class="form-input" placeholder="0" disabled>
</div>
<div class="form-group">
<label class="form-label">Rating (1-5)</label>
<input type="number" id="modal-rating" class="form-input" min="1" max="5" step="0.5" placeholder="4.5">
</div>
<div class="form-group">
<label class="form-label">Notes</label>
<textarea id="modal-notes" class="form-input" style="resize:vertical;min-height:60px" placeholder="Your thoughts…"></textarea>
</div>
<div style="display:flex;gap:8px;margin-bottom:12px">
<button onclick="libSummarizeNotes()" style="flex:1;padding:10px;background:#8b5cf6;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px">✨ Summarize Notes</button>
</div>
<div id="modal-summary" style="display:none;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;font-size:13px;color:#166534;line-height:1.6;margin-bottom:12px"></div>
<div class="form-buttons">
<button class="btn-save" onclick="libSaveBook()">Save</button>
<button class="btn-cancel" onclick="libCloseModal()">Close</button>
<button class="btn-delete" onclick="libDeleteBook()">Delete</button>
</div>
</div>
</div>

<script>
var _bkBooks = [];
var _bkCurrentBook = null;
var _bkScanner = null;
var _bkPhone = localStorage.getItem('miru_phone') || '';

function _miruPhone() {
  return localStorage.getItem('miru_phone') || '';
}

function libTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

  if (btn) btn.classList.add('active');

  if (tab === 'search') {
    document.getElementById('search-panel').classList.add('active');
    document.getElementById('book-input').focus();
  } else {
    document.getElementById('library-panel').classList.add('active');
    libLoadBooks();
  }
}

function libLoadBooks() {
  var phone = _miruPhone();
  if (!phone) {
    document.getElementById('lib-empty').style.display = 'block';
    document.getElementById('lib-books').innerHTML = '';
    return;
  }

  fetch('/api/library/books?phone=' + encodeURIComponent(phone))
    .then(r => r.json())
    .then(books => {
      _bkBooks = books || [];
      libRenderBooks();
    })
    .catch(e => {
      console.error('Load books failed:', e);
      document.getElementById('lib-empty').innerHTML = '<div style="color:#ef4444">Failed to load books</div>';
    });
}

function libRenderBooks() {
  var empty = document.getElementById('lib-empty');
  var booksDiv = document.getElementById('lib-books');

  if (!_bkBooks || _bkBooks.length === 0) {
    empty.style.display = 'block';
    booksDiv.innerHTML = '';
    return;
  }

  empty.style.display = 'none';
  booksDiv.innerHTML = _bkBooks.map(b => {
    var status = b.status || 'owned';
    var statusLabel = {
      'reading': '📖 Reading',
      'completed': '✓ Completed',
      'want': '⭐ Want to read',
      'owned': '📚 Own'
    }[status] || '📚 ' + status;

    var progress = '';
    if (b.pages_total && b.pages_read) {
      var pct = Math.round((b.pages_read / b.pages_total) * 100);
      progress = '<div class="book-progress">' + pct + '% read (' + b.pages_read + '/' + b.pages_total + ')</div>';
    }

    return '<div class="book-item" onclick="libEditBook(\'' + (b.isbn || '').replace(/'/g, '') + '\')">' +
    '<div class="book-title">' + (b.title || 'Unknown') + '</div>' +
    '<div class="book-author">' + (b.author || '') + '</div>' +
    '<div style="font-size:12px;color:#7c3aed;margin-top:6px;font-weight:600">' + statusLabel + '</div>' +
    (b.rating ? '<div style="font-size:12px;color:#f59e0b;margin-top:4px">⭐ ' + b.rating + '/5</div>' : '') +
    progress +
    '</div>';
  }).join('');
}

function bookSearch() {
  var q = document.getElementById('book-input').value.trim();
  if (!q) { alert('Enter a title, author, or ISBN'); return; }

  document.getElementById('book-loading').style.display = 'block';
  document.getElementById('book-error').style.display = 'none';
  document.getElementById('book-results').innerHTML = '';

  fetch('/api/library/books/search', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: q})
  })
  .then(r => r.json())
  .then(book => {
    document.getElementById('book-loading').style.display = 'none';
    document.getElementById('book-results').innerHTML =
      '<div class="book-item" onclick="libSelectBook(\'' + (book.isbn || '').replace(/'/g, '') + '\', ' + JSON.stringify(book).replace(/'/g, "\\'") + ')">' +
      '<div class="book-title">' + book.title + '</div>' +
      '<div class="book-author">' + book.author + '</div>' +
      '<div style="font-size:12px;color:#6b7280;margin-top:6px">' + (book.pages || 0) + ' pages</div>' +
      '</div>';
  })
  .catch(e => {
    document.getElementById('book-loading').style.display = 'none';
    var msg = document.getElementById('book-error');
    msg.style.display = 'block';
    msg.textContent = 'Book not found — try a different search';
  });
}

function libSelectBook(isbn, book) {
  _bkCurrentBook = book;
  document.getElementById('modal-title').textContent = book.title;
  document.getElementById('modal-status').value = 'owned';
  document.getElementById('modal-pages-read').value = '';
  document.getElementById('modal-pages-total').value = book.pages || '';
  document.getElementById('modal-rating').value = '';
  document.getElementById('modal-notes').value = '';
  document.getElementById('book-modal').classList.add('active');
}

function libEditBook(isbn) {
  var book = _bkBooks.find(b => b.isbn === isbn);
  if (!book) return;

  _bkCurrentBook = book;
  document.getElementById('modal-title').textContent = book.title;
  document.getElementById('modal-status').value = book.status || 'owned';
  document.getElementById('modal-pages-read').value = book.pages_read || '';
  document.getElementById('modal-pages-total').value = book.pages_total || '';
  document.getElementById('modal-rating').value = book.rating || '';
  document.getElementById('modal-notes').value = book.notes || '';
  document.getElementById('book-modal').classList.add('active');
}

function libSaveBook() {
  if (!_bkCurrentBook) return;
  var phone = _miruPhone();
  if (!phone) { alert('Need to set phone'); return; }

  var data = {
    isbn: _bkCurrentBook.isbn || '',
    title: _bkCurrentBook.title || '',
    author: _bkCurrentBook.author || '',
    status: document.getElementById('modal-status').value,
    pages: parseInt(document.getElementById('modal-pages-total').value) || 0,
    pages_read: parseInt(document.getElementById('modal-pages-read').value) || 0,
    rating: parseFloat(document.getElementById('modal-rating').value) || null,
    notes: document.getElementById('modal-notes').value,
    pages_total: parseInt(document.getElementById('modal-pages-total').value) || 0,
  };

  fetch('/api/library/books', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Phone': phone},
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.success) {
      libCloseModal();
      libLoadBooks();
    } else {
      alert('Save failed');
    }
  });
}

function libSummarizeNotes() {
  if (!_bkCurrentBook) return;
  var notes = document.getElementById('modal-notes').value.trim();
  if (!notes) { alert('No notes to summarize'); return; }

  var btn = event.target;
  btn.disabled = true;
  btn.textContent = '✨ Summarizing…';

  fetch('/api/library/books/' + encodeURIComponent(_bkCurrentBook.isbn) + '/summarize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      notes: notes,
      title: _bkCurrentBook.title
    })
  })
  .then(r => r.json())
  .then(res => {
    btn.disabled = false;
    btn.textContent = '✨ Summarize Notes';
    if (res.summary) {
      var summaryDiv = document.getElementById('modal-summary');
      summaryDiv.style.display = 'block';
      summaryDiv.innerHTML = '<strong>📝 Summary:</strong><br>' + res.summary.replace(/\n/g, '<br>');
    } else {
      alert('Summarization failed');
    }
  })
  .catch(e => {
    btn.disabled = false;
    btn.textContent = '✨ Summarize Notes';
    alert('Error: ' + e.message);
  });
}

function libDeleteBook() {
  if (!_bkCurrentBook || !confirm('Delete this book?')) return;
  libCloseModal();
  libLoadBooks();
}

function libCloseModal() {
  document.getElementById('book-modal').classList.remove('active');
  document.getElementById('modal-summary').style.display = 'none';
  document.getElementById('modal-summary').innerHTML = '';
  _bkCurrentBook = null;
}

function bookToggleScanner() {
  var wrap = document.getElementById('book-scan-wrap');
  if (wrap.style.display === 'none') {
    wrap.style.display = 'block';
    bookStartScanner();
  } else {
    bookStopScanner();
  }
}

function bookStartScanner() {
  if (_bkScanner) return;

  if (typeof Html5Qrcode === 'undefined') {
    alert('Scanner library not loaded. Please refresh the page.');
    console.error('Html5Qrcode is not defined');
    return;
  }

  try {
    _bkScanner = new Html5Qrcode("book-scan-reader");

    // Add status message
    var statusDiv = document.createElement('div');
    statusDiv.id = 'scanner-status';
    statusDiv.style.cssText = 'position:absolute;top:10px;left:10px;background:#fff;padding:8px 12px;border-radius:8px;font-size:12px;color:#1f2937;z-index:10;font-weight:600';
    statusDiv.textContent = '📷 Point at barcode...';
    document.getElementById('book-scan-wrap').appendChild(statusDiv);

    _bkScanner.start(
      {facingMode: "environment"},
      {fps: 15, qrbox: {width: 280, height: 280}},
      decodedText => {
        var code = decodedText.trim();
        console.log('[scanner] Detected:', code);

        // Extract ISBN from various formats
        var isbn = _extractISBN(code);
        if (isbn) {
          statusDiv.textContent = '✅ Found: ' + isbn;
          console.log('[scanner] Extracted ISBN:', isbn);
          setTimeout(() => {
            bookStopScanner();
            bookSearchISBN(isbn);
          }, 500);
        } else {
          statusDiv.textContent = '❌ Not an ISBN. Try again.';
          console.log('[scanner] No ISBN found in:', code);
        }
      },
      err => {
        // Silent - don't log every scan attempt error
      }
    ).catch(err => {
      console.error('[scanner] Failed to start:', err);
      alert('Camera error: ' + err.message + '\n\nMake sure you granted camera permission.');
      bookStopScanner();
    });
  } catch (e) {
    console.error('[scanner] Exception:', e);
    alert('Scanner error: ' + e.message);
  }
}

function _extractISBN(code) {
  // Remove spaces and hyphens
  var clean = code.replace(/[\s\-]/g, '');

  // ISBN-13 (13 digits starting with 978 or 979)
  var isbn13 = clean.match(/^(978|979)\d{10}$/);
  if (isbn13) return isbn13[0];

  // ISBN-10 (10 digits)
  var isbn10 = clean.match(/^\d{10}$/);
  if (isbn10) return isbn10[0];

  // EAN-13 (most books have this, treat as ISBN)
  var ean13 = clean.match(/^\d{13}$/);
  if (ean13) return ean13[0];

  // UPC-A (12 digits, common in US books)
  var upca = clean.match(/^\d{12}$/);
  if (upca) return upca[0];

  return null;
}

function bookSearchISBN(isbn) {
  document.getElementById('book-input').value = isbn;
  bookSearch();
}

function bookStopScanner() {
  if (_bkScanner) {
    _bkScanner.stop();
    _bkScanner = null;
  }
  document.getElementById('book-scan-wrap').style.display = 'none';
}

// Initialize
libLoadBooks();
</script>
</body>
</html>
