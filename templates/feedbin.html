<!DOCTYPE html>
<html>
<head>
    <title>📖 Feedbin Links — Miru</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto auto;
            gap: 15px;
            margin-top: 20px;
        }

        input, select, button {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input {
            background: white;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        button.secondary:hover {
            background: #efefef;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .links-list .link-card {
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .link-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .link-category {
            display: inline-block;
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.4;
        }

        .link-summary {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .link-meta {
            font-size: 11px;
            color: #999;
            margin-bottom: 15px;
        }

        .link-url {
            font-size: 12px;
            color: #667eea;
            word-break: break-all;
            margin-bottom: 15px;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .link-actions {
            display: flex;
            gap: 8px;
        }

        .link-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Feedbin Links</h1>
            <p style="color: #666; margin-top: 5px;">Browse, search, and organize your starred articles</p>

            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search links...">
                <select id="sourceFilter">
                    <option value="">All Sources</option>
                </select>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="🔬 Science">🔬 Science</option>
                    <option value="💻 Tech">💻 Tech</option>
                    <option value="📰 News">📰 News</option>
                    <option value="🎨 Design">🎨 Design</option>
                    <option value="📚 Learning">📚 Learning</option>
                    <option value="🎬 Media">🎬 Media</option>
                    <option value="💼 Business">💼 Business</option>
                </select>
                <select id="sortBy">
                    <option value="recent">Recent First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="random">Random</option>
                </select>
                <button onclick="loadLinks()">🔄 Refresh</button>
                <button id="viewToggle" class="secondary" onclick="toggleView()">📋 List</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalCount">-</div>
                    <div class="stat-label">Total Links</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="todayCount">-</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="weekCount">-</div>
                    <div class="stat-label">This Week</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="categoryCount">-</div>
                    <div class="stat-label">Categories</div>
                </div>
            </div>
        </header>

        <div id="linksContainer" class="links-grid">
            <div class="loading">
                <div class="spinner">⏳</div>
                <p style="margin-top: 15px;">Loading your Feedbin links...</p>
            </div>
        </div>
    </div>

    <script>
        let allLinks = [];
        let filteredLinks = [];
        let isListView = false;

        function toggleView() {
            isListView = !isListView;
            const container = document.getElementById('linksContainer');
            const toggle = document.getElementById('viewToggle');

            if (isListView) {
                container.className = 'links-list';
                toggle.textContent = '📊 Grid';
            } else {
                container.className = 'links-grid';
                toggle.textContent = '📋 List';
            }

            renderLinks(filteredLinks || allLinks);
        }

        async function loadLinks() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = '<div class="loading"><div class="spinner">⏳</div><p style="margin-top: 15px;">Loading...</p></div>';

            try {
                const response = await fetch('/api/feedbin/links');
                const data = await response.json();

                if (data.links) {
                    allLinks = data.links;
                    updateStats(data);
                    renderLinks(allLinks);
                } else {
                    showEmpty();
                }
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load links</p></div>`;
            }
        }

        function renderLinks(links) {
            const container = document.getElementById('linksContainer');

            if (!links || links.length === 0) {
                showEmpty();
                return;
            }

            container.className = isListView ? 'links-list' : 'links-grid';
            container.innerHTML = links.map(link => `
                <div class="link-card">
                    <div class="link-category">${link.category}</div>
                    <div class="link-title">${link.title || 'Untitled'}</div>
                    <div class="link-summary">${link.summary || ''}</div>
                    <div class="link-meta">
                        ${link.author ? `by ${link.author} · ` : ''}
                        ${new Date(link.published).toLocaleDateString()}
                    </div>
                    <div class="link-url"><strong>📎</strong> ${link.url}</div>
                    <div class="link-actions">
                        <button onclick="openLink('${link.url}')">Open</button>
                        <button class="secondary" onclick="copyUrl('${link.url}')">Copy</button>
                    </div>
                </div>
            `).join('');
        }

        function showEmpty() {
            document.getElementById('linksContainer').innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <div class="empty-state-icon">📭</div>
                    <p>No links found</p>
                    <p style="font-size: 12px; margin-top: 10px; color: #ccc;">Try adjusting your search or filters</p>
                </div>
            `;
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.total_count || 0;
            document.getElementById('todayCount').textContent = data.today_count || 0;
            document.getElementById('weekCount').textContent = data.week_count || 0;
            document.getElementById('categoryCount').textContent = data.category_count || 0;

            // Populate source filter
            if (data.sources) {
                const sourceSelect = document.getElementById('sourceFilter');
                data.sources.forEach(source => {
                    if (!Array.from(sourceSelect.options).find(o => o.value === source)) {
                        const option = document.createElement('option');
                        option.value = source;
                        option.textContent = source;
                        sourceSelect.appendChild(option);
                    }
                });
            }
        }

        function openLink(url) {
            window.open(url, '_blank');
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url);
            alert('Copied to clipboard!');
        }

        // Search and filter
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const source = document.getElementById('sourceFilter').value;

            filteredLinks = allLinks.filter(link => {
                const matchesSearch = !query ||
                    link.title.toLowerCase().includes(query) ||
                    link.summary.toLowerCase().includes(query) ||
                    link.url.toLowerCase().includes(query);

                const matchesCategory = !category || link.category === category;
                const matchesSource = !source || link.source === source;

                return matchesSearch && matchesCategory && matchesSource;
            });

            renderLinks(filteredLinks);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyFilters);
        document.getElementById('sourceFilter').addEventListener('change', applyFilters);

        document.getElementById('sortBy').addEventListener('change', (e) => {
            const sortType = e.target.value;
            let sorted = [...(filteredLinks || allLinks)];

            if (sortType === 'oldest') {
                sorted.sort((a, b) => new Date(a.published) - new Date(b.published));
            } else if (sortType === 'random') {
                for (let i = sorted.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
                }
            }

            renderLinks(sorted);
        });

        // Load on page load
        loadLinks();
    </script>
</body>
</html>
