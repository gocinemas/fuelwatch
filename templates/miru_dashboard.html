<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>💰 Miru Budget Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; margin-bottom: 10px; color: #333; }
        .subtitle { color: #666; font-size: 14px; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .card-label { color: #999; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .card-value { font-size: 32px; font-weight: bold; color: #667eea; }
        .card-detail { color: #666; font-size: 13px; margin-top: 8px; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }

        .chart-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #333; }

        .daily-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 150px;
            margin-bottom: 20px;
        }
        .day-bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 20px;
        }
        .day-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .category-bar {
            flex: 1;
            height: 30px;
            background: #f5f5f5;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }
        .category-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        .category-name { font-size: 13px; color: #333; font-weight: 500; min-width: 80px; }
        .category-amount { font-size: 13px; color: #667eea; font-weight: 600; min-width: 60px; text-align: right; }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        .status-on-pace { background: #e8f5e9; color: #2e7d32; }
        .status-warning { background: #fff3e0; color: #e65100; }
        .status-overspend { background: #ffebee; color: #c62828; }

        @media (max-width: 768px) {
            .cards { grid-template-columns: 1fr; }
            h1 { font-size: 20px; }
            .card-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Your Budget</h1>
            <p class="subtitle" id="dateRange">August 2026</p>
        </header>

        <div class="cards">
            <div class="card">
                <div class="card-label">THIS MONTH'S SPEND</div>
                <div class="card-value">£<span id="currentSpend">240</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 35%;"></div>
                </div>
                <div class="card-detail" id="progressText">£240 of £620 budget (39%)</div>
            </div>

            <div class="card">
                <div class="card-label">PROJECTED TOTAL</div>
                <div class="card-value">£<span id="projectedSpend">750</span></div>
                <div class="card-detail" id="projectedDetail">+£130 over average</div>
                <div class="status-badge status-warning" id="statusBadge">⚠️ Overspending</div>
            </div>

            <div class="card">
                <div class="card-label">PACE</div>
                <div class="card-value" id="dailyPace">£22</div>
                <div class="card-detail">/day (avg: £20.60)</div>
            </div>

            <div class="card">
                <div class="card-label">DAYS REMAINING</div>
                <div class="card-value" id="daysRemaining">19</div>
                <div class="card-detail">in this month</div>
            </div>
        </div>

        <div class="chart-section">
            <h3 class="chart-title">📅 This Week's Spending</h3>
            <div class="daily-chart" id="dailyChart">
                <!-- Populated by JS -->
            </div>
        </div>

        <div class="chart-section">
            <h3 class="chart-title">🏪 Top Spending Categories</h3>
            <div class="category-list" id="categoryList">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // Mock data - in production, fetch from API
        const data = {
            currentSpend: 240,
            budget: 620,
            averageMonthly: 620,
            projectedTotal: 750,
            daysIntoMonth: 11,
            daysInMonth: 30,
            dailyBreakdown: [
                { day: 'Mon', amount: 45 },
                { day: 'Tue', amount: 38 },
                { day: 'Wed', amount: 52 },
                { day: 'Thu', amount: 35 },
                { day: 'Fri', amount: 70 }
            ],
            categories: {
                'Groceries': 120,
                'Coffee': 45,
                'Transport': 75
            }
        };

        // Update main cards
        document.getElementById('currentSpend').textContent = data.currentSpend;
        document.getElementById('projectedSpend').textContent = Math.round(data.projectedTotal);
        document.getElementById('daysRemaining').textContent = data.daysInMonth - data.daysIntoMonth;
        document.getElementById('dailyPace').textContent = (data.currentSpend / data.daysIntoMonth).toFixed(2);

        const progress = (data.currentSpend / data.budget * 100);
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressText').textContent = `£${data.currentSpend} of £${data.budget} budget (${Math.round(progress)}%)`;

        const overage = data.projectedTotal - data.averageMonthly;
        const statusEl = document.getElementById('statusBadge');
        if (overage > 50) {
            statusEl.textContent = '⚠️ Overspending';
            statusEl.className = 'status-badge status-warning';
        } else if (overage > 0) {
            statusEl.textContent = '⚠️ Slight overspend';
            statusEl.className = 'status-badge status-warning';
        } else {
            statusEl.textContent = '✅ On pace';
            statusEl.className = 'status-badge status-on-pace';
        }

        document.getElementById('projectedDetail').textContent = (overage > 0 ? '+' : '') + '£' + Math.abs(overage).toFixed(0) + (overage > 0 ? ' over' : ' under') + ' average';

        // Daily chart
        const maxDaily = Math.max(...data.dailyBreakdown.map(d => d.amount));
        const chartHTML = data.dailyBreakdown.map(d => `
            <div class="day-bar" style="height: ${(d.amount / maxDaily * 100)}%;">
                <div class="day-label">${d.day}<br>£${d.amount}</div>
            </div>
        `).join('');
        document.getElementById('dailyChart').innerHTML = chartHTML;

        // Categories
        const totalSpent = Object.values(data.categories).reduce((a, b) => a + b, 0);
        const categoryHTML = Object.entries(data.categories)
            .sort((a, b) => b[1] - a[1])
            .map(([name, amount]) => `
                <div class="category-item">
                    <div class="category-name">${name}</div>
                    <div class="category-bar">
                        <div class="category-fill" style="width: ${(amount / totalSpent * 100)}%;"></div>
                    </div>
                    <div class="category-amount">£${amount}</div>
                </div>
            `).join('');
        document.getElementById('categoryList').innerHTML = categoryHTML;
    </script>
</body>
</html>
