<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bookmarks · Miru</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f5f5f7;
      --surface: #ffffff;
      --border:  #e5e5ea;
      --text:    #111111;
      --muted:   #6e6e73;
      --subtle:  #aeaeb2;
      --accent:  #007aff;
      --danger:  #ff3b30;
      --green:   #34c759;
      --r:       14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #000000;
        --surface: #1c1c1e;
        --border:  #2c2c2e;
        --text:    #f2f2f7;
        --muted:   #8e8e93;
        --subtle:  #48484a;
        --accent:  #0a84ff;
        --danger:  #ff453a;
        --green:   #30d158;
      }
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    body { padding-bottom: env(safe-area-inset-bottom); }

    /* ── TOP BAR ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
    }
    .topbar-row {
      max-width: 600px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px;
    }
    .logo { display: flex; align-items: center; gap: 7px; text-decoration: none; flex-shrink: 0; }
    .logo-dot {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg,#dc2626,#b91c1c);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text { font-size: 20px; font-weight: 900; letter-spacing: -0.8px; color: var(--text); }
    .page-title { font-size: 17px; font-weight: 700; color: var(--text); flex: 1; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s;
    }
    .icon-btn:active { background: var(--border); }
    .icon-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── SEARCH BAR ── */
    #search-row {
      max-width: 600px; margin: 0 auto;
      padding-bottom: 10px;
      display: none;
    }
    #search-row.visible { display: flex; gap: 8px; align-items: center; }
    #search-input {
      flex: 1; border: 1px solid var(--border); border-radius: 12px;
      padding: 9px 14px 9px 36px; font-size: 14px; outline: none;
      background: var(--bg); color: var(--text);
    }
    .search-wrap { position: relative; flex: 1; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; opacity: .5; }
    #search-cancel { font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; white-space: nowrap; background: none; border: none; }

    /* ── FILTER TABS ── */
    #filter-row {
      max-width: 600px; margin: 0 auto;
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    #filter-row::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0; padding: 5px 13px; border-radius: 99px;
      font-size: 13px; font-weight: 600; cursor: pointer; border: none;
      background: var(--bg); color: var(--muted);
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s;
    }
    .filter-tab.active { background: var(--text); color: var(--bg); }

    /* topbar spacer */
    #topbar-spacer { height: 0; } /* set by JS */

    /* ── MAIN WRAP ── */
    #wrap { max-width: 600px; margin: 0 auto; padding: 12px 12px 100px; }

    /* ── LOGIN SCREEN ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 24px 40px; text-align: center;
    }
    #login-screen .icon { font-size: 52px; margin-bottom: 16px; }
    #login-screen h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    #login-screen p { font-size: 14px; color: var(--muted); margin-bottom: 24px; max-width: 280px; line-height: 1.6; }
    #phone-input {
      border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 16px; font-size: 15px; width: 100%; max-width: 260px;
      text-align: center; outline: none; background: var(--surface); color: var(--text);
      margin-bottom: 10px;
    }
    #login-error { font-size: 12px; color: var(--danger); margin-bottom: 8px; display: none; }
    #login-btn {
      background: var(--text); color: var(--bg); border: none;
      border-radius: 14px; padding: 13px 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; width: 100%; max-width: 260px;
    }

    /* ── GRID / LIST VIEWS ── */
    #bm-list { }
    #bm-grid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    body.grid-mode #bm-list { display: none; }
    body.grid-mode #bm-grid { display: grid; }

    /* ── LIST CARD ── */
    .bm-list-card {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
      margin-bottom: 8px;
      position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .bm-list-card .thumb-col { flex-shrink: 0; }
    .bm-list-card .thumb {
      width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .bm-list-card .thumb img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; display: block; }
    .bm-list-card .body { flex: 1; min-width: 0; }
    .bm-list-card .domain { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
    .bm-list-card .fav { width: 13px; height: 13px; border-radius: 3px; }
    .bm-list-card .title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .bm-list-card .snippet { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bm-list-card .meta-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
    .bm-list-card .date { font-size: 11px; color: var(--subtle); }
    .bm-list-card .cat-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px;
      background: var(--bg); color: var(--muted); letter-spacing: .2px;
    }
    .bm-list-card .actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .bm-action-btn {
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--muted);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .bm-action-btn.danger { border-color: #fecaca; background: #fff5f5; color: var(--danger); }
    @media (prefers-color-scheme: dark) {
      .bm-action-btn.danger { border-color: #4a1515; background: #2a0a0a; }
    }
    .bm-list-card.read { opacity: .5; }

    /* swipe-delete reveal */
    .swipe-delete-bg {
      position: absolute; right: 0; top: 0; bottom: 0; width: 80px;
      background: var(--danger); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; border-radius: 0 var(--r) var(--r) 0;
      transform: translateX(80px); transition: transform .2s;
      pointer-events: none;
    }
    .bm-list-card.swiping .swipe-delete-bg { transform: translateX(0); }

    /* ── GRID CARD ── */
    .bm-grid-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: flex; flex-direction: column;
    }
    .bm-grid-card .g-thumb {
      width: 100%; aspect-ratio: 16/10; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .bm-grid-card .g-thumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .bm-grid-card .g-body { padding: 9px 10px 10px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .bm-grid-card .g-domain { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .bm-grid-card .g-fav { width: 12px; height: 12px; border-radius: 2px; }
    .bm-grid-card .g-title { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .bm-grid-card .g-date { font-size: 10px; color: var(--subtle); margin-top: auto; padding-top: 4px; }

    /* ── EMPTY / LOADING ── */
    .state-msg { text-align: center; padding: 56px 24px 32px; }
    .state-msg .emoji { font-size: 44px; margin-bottom: 14px; }
    .state-msg h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
    .state-msg p { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 280px; margin: 0 auto; }
    .spinner-ring { display: inline-block; width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--muted); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FAB ── */
    #fab {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 16px) + 20px); right: 20px;
      width: 54px; height: 54px; border-radius: 27px;
      background: var(--text); color: var(--bg);
      border: none; font-size: 26px; font-weight: 300; line-height: 1;
      cursor: pointer; z-index: 90;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #fab:active { transform: scale(.94); }

    /* ── SHEET (shared) ── */
    .sheet-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
    }
    .sheet-backdrop.open { display: block; }
    .sheet {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
      background: var(--surface); border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
      transform: translateY(100%); transition: transform .28s cubic-bezier(.32,0,.67,0);
      max-width: 600px; margin: 0 auto;
    }
    .sheet.open { display: block; }
    .sheet.slide-up { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 18px; }
    .sheet-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 16px; letter-spacing: -0.4px; }

    /* ── ADD SHEET ── */
    .tab-row { display: flex; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
    .tab-opt { flex: 1; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: var(--bg); color: var(--muted); text-align: center; -webkit-tap-highlight-color: transparent; }
    .tab-opt.active { background: var(--surface); color: var(--text); }
    .add-field { border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; font-size: 14px; width: 100%; outline: none; background: var(--bg); color: var(--text); font-family: inherit; }
    .add-field::placeholder { color: var(--subtle); }
    textarea.add-field { resize: none; height: 120px; }
    .add-hint { font-size: 11px; color: var(--muted); margin: 6px 0 12px; line-height: 1.5; }
    .save-btn {
      width: 100%; background: var(--text); color: var(--bg);
      border: none; border-radius: 13px; padding: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .save-btn:disabled { opacity: .5; }
    #add-status { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; min-height: 18px; }

    /* ── COLLECTION STRIP ── */
    #coll-strip { display: none; }
    #coll-strip.visible {
      display: flex; gap: 7px; overflow-x: auto; padding: 0 0 10px;
      scrollbar-width: none;
    }
    #coll-strip::-webkit-scrollbar { display: none; }
    .coll-chip {
      flex-shrink: 0; padding: 6px 13px; border-radius: 99px;
      font-size: 12px; font-weight: 600; cursor: pointer; border: none;
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
    }
    .coll-chip.active { background: #ede9fe; color: #6d28d9; border-color: #c4b5fd; }
    @media (prefers-color-scheme: dark) {
      .coll-chip.active { background: #2d1f5e; color: #a78bfa; border-color: #5b3fa0; }
    }
    .coll-chip.new-coll { color: var(--accent); border-style: dashed; }
  </style>
</head>
<body>

<!-- ── TOP BAR ── -->
<header id="topbar">
  <div class="topbar-row">
    <a href="/" class="logo">
      <div class="logo-dot">👁</div>
      <span class="logo-text">Miru</span>
    </a>
    <span class="page-title">Bookmarks</span>
    <button class="icon-btn" id="btn-search" onclick="toggleSearch()" title="Search">🔍</button>
    <button class="icon-btn" id="btn-list"   onclick="setView('list')"  title="List view">☰</button>
    <button class="icon-btn active" id="btn-grid" onclick="setView('grid')" title="Grid view">⊞</button>
  </div>
  <div id="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="search" placeholder="Search bookmarks…" oninput="onSearch()" autocomplete="off" />
    </div>
    <button id="search-cancel" onclick="closeSearch()">Cancel</button>
  </div>
  <div id="filter-row">
    <!-- filled by JS -->
  </div>
</header>

<div id="topbar-spacer"></div>

<!-- ── MAIN ── -->
<div id="wrap">

  <!-- Login screen -->
  <div id="login-screen" style="display:none">
    <div class="icon">🔖</div>
    <h1>Bookmarks</h1>
    <p>Save links, tabs, and anything worth reading later — all in one place.</p>
    <form id="login-form" action="/saves-login" method="POST" onsubmit="doLogin(event)" style="display:flex;flex-direction:column;align-items:center;width:100%">
      <input name="phone" id="phone-input" type="tel" placeholder="+44 7911 123456" autocomplete="tel" />
      <div id="login-error"></div>
      <button type="submit" id="login-btn">Access Bookmarks</button>
    </form>
  </div>

  <!-- Main view -->
  <div id="main-view" style="display:none">
    <div id="coll-strip"><!-- collections injected here --></div>
    <!-- List view -->
    <div id="bm-list"></div>
    <!-- Grid view -->
    <div id="bm-grid"></div>
  </div>

</div>

<!-- ── FAB ── -->
<button id="fab" onclick="openAddSheet()">+</button>

<!-- ── ADD SHEET ── -->
<div class="sheet-backdrop" id="add-backdrop" onclick="closeAddSheet()"></div>
<div class="sheet" id="add-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Save bookmarks</div>

  <div class="tab-row">
    <button class="tab-opt active" id="tab-single" onclick="switchAddTab('single')">🔗 Single URL</button>
    <button class="tab-opt" id="tab-bulk" onclick="switchAddTab('bulk')">📋 Bulk (OneTab)</button>
  </div>

  <!-- Single -->
  <div id="add-single">
    <input id="url-input" class="add-field" type="url" placeholder="https://…" />
    <div class="add-hint">Paste any URL — Miru will fetch the title and summary.</div>
  </div>

  <!-- Bulk -->
  <div id="add-bulk" style="display:none">
    <textarea id="bulk-input" class="add-field" placeholder="Paste multiple URLs, one per line.&#10;&#10;Works with OneTab exports — just paste the whole list."></textarea>
    <div class="add-hint">Each URL on its own line. Titles will be resolved in the background.</div>
  </div>

  <button class="save-btn" id="save-btn" onclick="doSave()">Save</button>
  <div id="add-status"></div>
</div>

<!-- ── COLLECTION EDITOR SHEET ── -->
<div class="sheet-backdrop" id="coll-backdrop" onclick="closeCollSheet()"></div>
<div class="sheet" id="coll-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="coll-sheet-title">New Collection</div>
  <input id="coll-name-input" class="add-field" type="text" placeholder="e.g. Work, Reading list, Design…" style="margin-bottom:10px" onkeydown="if(event.key==='Enter')saveCollection()" />
  <button class="save-btn" onclick="saveCollection()">Create</button>
</div>

<script>
// ── Auth ─────────────────────────────────────────────────────────────────────
function _cookie(n) {
  var m = document.cookie.match('(?:^|;)\\s*' + n + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : '';
}
(function() {
  var p = new URLSearchParams(location.search);
  var tok   = p.get('st') || _cookie('miru_saves_token');
  var phone = p.get('sp') || _cookie('miru_saves_phone');
  if (tok)   localStorage.setItem('wa_saves_token', tok);
  if (phone) localStorage.setItem('miru_phone', phone);
  if (phone && document.getElementById('phone-input'))
    document.getElementById('phone-input').value = phone;
})();
function _tok()   { return localStorage.getItem('wa_saves_token') || ''; }
function _phone() { return localStorage.getItem('miru_phone') || ''; }
function _hdrs()  {
  var h = {'Content-Type': 'application/json'};
  var t = _tok(); if (t) h['X-Library-PIN'] = t;
  var p = _phone(); if (p) h['X-User-Phone'] = p;
  return h;
}

async function doLogin(e) {
  e.preventDefault();
  var phone = document.getElementById('phone-input').value.trim();
  if (!phone) return;
  document.getElementById('login-btn').textContent = '…';
  try {
    var r = await fetch('/saves-login', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'phone=' + encodeURIComponent(phone)
    });
    if (r.ok || r.redirected) {
      var tok = _tok();
      if (!tok) {
        document.getElementById('login-error').textContent = 'Enter your number to continue.';
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('login-btn').textContent = 'Access Bookmarks';
        return;
      }
      showMain();
    } else {
      document.getElementById('login-error').textContent = 'Something went wrong — try again.';
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('login-btn').textContent = 'Access Bookmarks';
    }
  } catch(err) {
    document.getElementById('login-error').textContent = 'Network error — try again.';
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-btn').textContent = 'Access Bookmarks';
  }
}

// ── State ─────────────────────────────────────────────────────────────────────
var _all = [];
var _activeFilter = 'all';
var _activeCollection = null;
var _addMode = 'single';
var _searchOpen = false;
var _view = localStorage.getItem('bm_view') || 'grid';

// ── Collections (localStorage) ────────────────────────────────────────────────
function _collMap() {
  try { return JSON.parse(localStorage.getItem('bm_collections') || '{}'); } catch(e) { return {}; }
}
function _saveCollMap(m) { localStorage.setItem('bm_collections', JSON.stringify(m)); }
// collMap = { "Work": ["id1","id2"], "Later": ["id3"] }

function getCollectionsForId(id) {
  var m = _collMap();
  return Object.keys(m).filter(function(c) { return (m[c] || []).includes(id); });
}

function openNewCollectionSheet() {
  document.getElementById('coll-sheet-title').textContent = 'New Collection';
  document.getElementById('coll-name-input').value = '';
  _pendingCollId = null;
  openSheet('coll-sheet', 'coll-backdrop');
  setTimeout(function() { document.getElementById('coll-name-input').focus(); }, 350);
}

var _pendingCollId = null;
function openAddToCollSheet(id) {
  _pendingCollId = id;
  document.getElementById('coll-sheet-title').textContent = 'Add to Collection';
  document.getElementById('coll-name-input').value = '';
  openSheet('coll-sheet', 'coll-backdrop');
  setTimeout(function() { document.getElementById('coll-name-input').focus(); }, 350);
}

function saveCollection() {
  var name = document.getElementById('coll-name-input').value.trim();
  if (!name) return;
  var m = _collMap();
  if (!m[name]) m[name] = [];
  if (_pendingCollId && !m[name].includes(_pendingCollId)) {
    m[name].push(_pendingCollId);
  }
  _saveCollMap(m);
  closeSheet('coll-sheet', 'coll-backdrop');
  renderCollectionStrip();
  renderBoth();
}

function removeFromCollection(id, coll) {
  var m = _collMap();
  if (m[coll]) m[coll] = m[coll].filter(function(x) { return x !== id; });
  _saveCollMap(m);
  renderCollectionStrip();
  renderBoth();
}

function renderCollectionStrip() {
  var m = _collMap();
  var colls = Object.keys(m);
  var el = document.getElementById('coll-strip');
  if (!colls.length) { el.className = ''; return; }
  el.className = 'visible';
  var html = colls.map(function(c) {
    var active = _activeCollection === c;
    return '<button class="coll-chip' + (active ? ' active' : '') + '" onclick="filterCollection(\'' + c.replace(/'/g,"\\'") + '\')">'
      + '📁 ' + c + ' <span style="opacity:.6;font-size:10px">(' + (m[c] || []).length + ')</span>'
      + '</button>';
  }).join('');
  html += '<button class="coll-chip new-coll" onclick="openNewCollectionSheet()">+ New</button>';
  el.innerHTML = html;
}

function filterCollection(name) {
  _activeCollection = (_activeCollection === name) ? null : name;
  renderCollectionStrip();
  renderBoth();
}

// ── View toggle ───────────────────────────────────────────────────────────────
function setView(v) {
  _view = v;
  localStorage.setItem('bm_view', v);
  document.body.classList.toggle('grid-mode', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
}

// ── Filter tabs ───────────────────────────────────────────────────────────────
var _FILTERS = [
  {key:'all',     label:'All'},
  {key:'article', label:'🔗 Links'},
  {key:'video',   label:'📺 Videos'},
  {key:'place',   label:'🏪 Places'},
  {key:'product', label:'📦 Products'},
  {key:'event',   label:'🎫 Events'},
  {key:'recipe',  label:'🍳 Recipes'},
  {key:'wine',    label:'🍷 Wine'},
  {key:'photo',   label:'📷 Images'},
  {key:'doc',     label:'📄 Docs'},
];

function _catOf(s) {
  if ((s.url || '').startsWith('book:')) return 'book';
  var t = s.title || '';
  if (t.startsWith('🍳')) return 'recipe';
  if (t.startsWith('🍷')) return 'wine';
  if (t.startsWith('📺')) return 'video';
  if (t.startsWith('📦')) return 'product';
  if (t.startsWith('🏷️')) return 'brand';
  if (t.startsWith('🏪') || t.startsWith('🍽️')) return 'place';
  if (t.startsWith('📢')) return 'ad';
  if (t.startsWith('🎫')) return 'event';
  if (t.startsWith('🧾')) return 'receipt';
  if (t.startsWith('📄')) return 'doc';
  if (t.startsWith('📷') || t.startsWith('🪧')) return 'photo';
  if (s.category) return s.category;
  return 'article';
}

function _emoji(cat) {
  return {article:'🔗',video:'📺',place:'🏪',product:'📦',event:'🎫',recipe:'🍳',wine:'🍷',photo:'📷',doc:'📄',brand:'🏷️',ad:'📢',receipt:'🧾',book:'📚'}[cat] || '🔖';
}

function renderFilterTabs() {
  var counts = {all: _all.length};
  _all.forEach(function(s) { var c = _catOf(s); counts[c] = (counts[c]||0) + 1; });
  var el = document.getElementById('filter-row');
  el.innerHTML = _FILTERS.filter(function(f) {
    return f.key === 'all' || counts[f.key] > 0;
  }).map(function(f) {
    var active = _activeFilter === f.key;
    return '<button class="filter-tab' + (active ? ' active' : '') + '" onclick="setFilter(\'' + f.key + '\')">'
      + f.label + (counts[f.key] && !active ? ' <span style="opacity:.5;font-size:11px">' + (counts[f.key]||'') + '</span>' : '')
      + '</button>';
  }).join('');
}

function setFilter(f) {
  _activeFilter = f;
  _activeCollection = null;
  renderFilterTabs();
  renderCollectionStrip();
  renderBoth();
}

// ── Visible items (after filter + collection + search) ────────────────────────
function _visible(q) {
  var m = _collMap();
  var items = _all.filter(function(s) {
    // category filter
    if (_activeFilter !== 'all' && _catOf(s) !== _activeFilter) return false;
    // collection filter
    if (_activeCollection && !(m[_activeCollection] || []).includes(s.id)) return false;
    // search
    if (q) {
      var hay = ((s.title||'') + ' ' + (s.url||'') + ' ' + (s.summary||'')).toLowerCase();
      return q.toLowerCase().split(/\s+/).every(function(w) { return hay.includes(w); });
    }
    return true;
  });
  return items;
}

// ── Domain / favicon helpers ──────────────────────────────────────────────────
function _domain(url) {
  if (!url) return '';
  try { return new URL(url).hostname.replace(/^www\./,''); } catch(e) { return ''; }
}
function _favUrl(url) {
  var d = _domain(url);
  return d ? 'https://www.google.com/s2/favicons?domain=' + d + '&sz=32' : '';
}
function _ogImg(s) { return s.image_url || ''; }

// ── Date formatting ───────────────────────────────────────────────────────────
function _fmtDate(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var now = new Date();
  var diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 7*86400) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}

// ── Render list view ──────────────────────────────────────────────────────────
function _listCardHtml(s) {
  var domain = _domain(s.url);
  var fav    = _favUrl(s.url);
  var og     = _ogImg(s);
  var cat    = _catOf(s);
  var emoji  = _emoji(cat);
  var colls  = getCollectionsForId(s.id);

  var thumbHtml = og
    ? '<div class="thumb" style="background:none"><img src="' + og + '" onerror="this.parentElement.innerHTML=\'' + emoji + '\'" /></div>'
    : '<div class="thumb">' + emoji + '</div>';

  var domainHtml = domain
    ? '<div class="domain">'
      + (fav ? '<img class="fav" src="' + fav + '" onerror="this.style.display=\'none\'" />' : '')
      + domain
      + '</div>'
    : '';

  var rawTitle = s.title || domain || 'Bookmark';
  var prefix = rawTitle.match(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}\s]+/u);
  var dispTitle = prefix ? rawTitle.slice(prefix[0].length).trim() || rawTitle : rawTitle;

  var snippet = (s.summary || '').replace(/AIRESULT:[^\n]*/g,'').replace(/META:[^\n]*/,'').replace(/\n+/g,' ').trim().slice(0,180);

  var collBadges = colls.map(function(c) {
    return '<span style="font-size:10px;background:#ede9fe;color:#6d28d9;border-radius:99px;padding:1px 7px;font-weight:600">'
      + '📁 ' + c + ' <span onclick="event.stopPropagation();removeFromCollection(\'' + s.id + '\',\'' + c.replace(/'/g,"\\'") + '\')" style="cursor:pointer;opacity:.6">×</span></span>';
  }).join('');

  var openHref = s.url && !s.url.startsWith('book:') ? s.url : s.image_url || '#';
  var openLabel = s.image_url && !s.url ? '🖼 View' : '↗ Open';

  return '<div id="bmc-' + s.id + '" class="bm-list-card' + (s.status === 'read' ? ' read' : '') + '">'
    + '<div class="swipe-delete-bg">🗑</div>'
    + '<div class="thumb-col">' + thumbHtml + '</div>'
    + '<div class="body">'
      + domainHtml
      + '<div class="title">' + dispTitle + '</div>'
      + (snippet ? '<div class="snippet">' + snippet + '</div>' : '')
      + '<div class="meta-row">'
        + '<span class="date">' + _fmtDate(s.created_at) + '</span>'
        + (colls.length ? collBadges : '')
      + '</div>'
      + '<div class="actions">'
        + (openHref !== '#' ? '<a class="bm-action-btn" href="' + openHref + '" target="_blank" rel="noopener">' + openLabel + '</a>' : '')
        + '<button class="bm-action-btn" onclick="addToColl(\'' + s.id + '\')">📁 Collect</button>'
        + (s.status !== 'read' ? '<button class="bm-action-btn" onclick="markRead(\'' + s.id + '\',this)">✓ Done</button>' : '')
        + '<button class="bm-action-btn danger" onclick="bmDelete(\'' + s.id + '\',this)">🗑</button>'
      + '</div>'
    + '</div>'
    + '</div>';
}

// ── Render grid view ──────────────────────────────────────────────────────────
function _gridCardHtml(s) {
  var domain = _domain(s.url);
  var fav    = _favUrl(s.url);
  var og     = _ogImg(s);
  var cat    = _catOf(s);
  var emoji  = _emoji(cat);
  var openHref = s.url && !s.url.startsWith('book:') ? s.url : s.image_url || '#';

  var rawTitle = s.title || domain || 'Bookmark';
  var prefix = rawTitle.match(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}\s]+/u);
  var dispTitle = prefix ? rawTitle.slice(prefix[0].length).trim() || rawTitle : rawTitle;

  var thumbContent = og
    ? '<img src="' + og + '" onerror="this.style.display=\'none\'" />' + emoji
    : emoji;

  var card = '<div class="bm-grid-card" onclick="' + (openHref !== '#' ? 'window.open(\'' + openHref.replace(/'/g,"\\'") + '\',\'_blank\')' : '') + '">'
    + '<div class="g-thumb">' + thumbContent + '</div>'
    + '<div class="g-body">'
      + (domain ? '<div class="g-domain">' + (fav ? '<img class="g-fav" src="' + fav + '" onerror="this.style.display=\'none\'" />' : '') + domain + '</div>' : '')
      + '<div class="g-title">' + dispTitle + '</div>'
      + '<div class="g-date">' + _fmtDate(s.created_at) + '</div>'
    + '</div>'
    + '</div>';
  return card;
}

// ── Render both views ─────────────────────────────────────────────────────────
function renderBoth(q) {
  q = q || document.getElementById('search-input').value.trim();
  var items = _visible(q);
  var listEl = document.getElementById('bm-list');
  var gridEl = document.getElementById('bm-grid');

  if (!items.length) {
    var msg = '<div class="state-msg"><div class="emoji">🔖</div><h2>No bookmarks yet</h2><p>Tap + to save a link or import a OneTab list.</p></div>';
    listEl.innerHTML = msg;
    gridEl.innerHTML = '';
    return;
  }
  listEl.innerHTML = items.map(_listCardHtml).join('');
  gridEl.innerHTML = items.map(_gridCardHtml).join('');
  attachSwipe();
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function load() {
  document.getElementById('bm-list').innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner-ring"></span></div>';
  document.getElementById('bm-grid').innerHTML = '';
  try {
    var r = await fetch('/api/wa-saves', {headers: _hdrs()});
    if (r.status === 401) { signOut(); return; }
    var d = await r.json();
    _all = (d.saves || []).filter(function(s) {
      return !(s.title||'').startsWith('🎵 ') && !(s.url||'').startsWith('book:');
    });
    renderFilterTabs();
    renderCollectionStrip();
    renderBoth();
  } catch(e) {
    document.getElementById('bm-list').innerHTML = '<div class="state-msg"><div class="emoji">😕</div><h2>Couldn\'t load</h2><p>Check your connection and try again.</p></div>';
  }
}

// ── CRUD ──────────────────────────────────────────────────────────────────────
async function bmDelete(id, btn) {
  if (btn) btn.textContent = '…';
  await fetch('/api/wa-saves/delete', {method:'POST', headers:_hdrs(), body:JSON.stringify({id})});
  _all = _all.filter(function(s) { return s.id !== id; });
  var card = document.getElementById('bmc-' + id);
  if (card) { card.style.transition = 'opacity .2s'; card.style.opacity = '0'; setTimeout(function() { card.remove(); }, 200); }
  var gridCard = document.querySelector('#bm-grid .bm-grid-card'); // simple refresh grid
  renderFilterTabs();
  renderCollectionStrip();
  document.getElementById('bm-grid').innerHTML = _visible().map(_gridCardHtml).join('');
}

async function markRead(id, btn) {
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  await fetch('/api/wa-saves/update', {method:'POST', headers:_hdrs(), body:JSON.stringify({id, status:'read'})});
  var idx = _all.findIndex(function(s) { return s.id === id; });
  if (idx !== -1) _all[idx].status = 'read';
  var card = document.getElementById('bmc-' + id);
  if (card) card.classList.add('read');
}

function addToColl(id) { openAddToCollSheet(id); }

// ── Swipe to delete ───────────────────────────────────────────────────────────
function attachSwipe() {
  document.querySelectorAll('.bm-list-card').forEach(function(card) {
    var startX = 0, dx = 0, swiping = false;
    card.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX; dx = 0; swiping = false;
    }, {passive: true});
    card.addEventListener('touchmove', function(e) {
      dx = e.touches[0].clientX - startX;
      if (Math.abs(dx) > 10) swiping = true;
      if (dx < 0) {
        card.style.transform = 'translateX(' + Math.max(dx, -80) + 'px)';
        card.classList.add('swiping');
      }
    }, {passive: true});
    card.addEventListener('touchend', function() {
      if (dx < -60) {
        var id = card.id.replace('bmc-', '');
        card.style.transition = 'transform .2s, opacity .2s';
        card.style.transform = 'translateX(-100%)';
        card.style.opacity = '0';
        setTimeout(function() { bmDelete(id, null); }, 200);
      } else {
        card.style.transition = 'transform .2s';
        card.style.transform = '';
        card.classList.remove('swiping');
        setTimeout(function() { card.style.transition = ''; }, 200);
      }
    });
  });
}

// ── Search ────────────────────────────────────────────────────────────────────
function toggleSearch() {
  _searchOpen = !_searchOpen;
  var row = document.getElementById('search-row');
  var btn = document.getElementById('btn-search');
  row.classList.toggle('visible', _searchOpen);
  btn.classList.toggle('active', _searchOpen);
  if (_searchOpen) setTimeout(function() { document.getElementById('search-input').focus(); }, 150);
  else { document.getElementById('search-input').value = ''; renderBoth(); }
  setTopbarSpacer();
}
function closeSearch() {
  _searchOpen = false;
  document.getElementById('search-row').classList.remove('visible');
  document.getElementById('btn-search').classList.remove('active');
  document.getElementById('search-input').value = '';
  renderBoth();
  setTopbarSpacer();
}
var _st = null;
function onSearch() {
  clearTimeout(_st);
  _st = setTimeout(function() { renderBoth(document.getElementById('search-input').value.trim()); }, 200);
}

// ── Add sheet ─────────────────────────────────────────────────────────────────
function openAddSheet() { openSheet('add-sheet', 'add-backdrop'); setTimeout(function() { document.getElementById('url-input').focus(); }, 350); }
function closeAddSheet() { closeSheet('add-sheet', 'add-backdrop'); }
function switchAddTab(mode) {
  _addMode = mode;
  document.getElementById('tab-single').classList.toggle('active', mode === 'single');
  document.getElementById('tab-bulk').classList.toggle('active', mode === 'bulk');
  document.getElementById('add-single').style.display = mode === 'single' ? 'block' : 'none';
  document.getElementById('add-bulk').style.display   = mode === 'bulk'   ? 'block' : 'none';
  document.getElementById('add-status').textContent = '';
  setTimeout(function() {
    if (mode === 'single') document.getElementById('url-input').focus();
    else document.getElementById('bulk-input').focus();
  }, 100);
}

async function doSave() {
  var btn = document.getElementById('save-btn');
  var status = document.getElementById('add-status');
  btn.disabled = true;

  if (_addMode === 'single') {
    var url = document.getElementById('url-input').value.trim();
    if (!url) { btn.disabled = false; return; }
    btn.textContent = 'Saving…';
    status.textContent = '';
    try {
      var r = await fetch('/api/wa-saves/add', {method:'POST', headers:_hdrs(), body:JSON.stringify({url})});
      if (r.ok) {
        document.getElementById('url-input').value = '';
        status.style.color = 'var(--green)';
        status.textContent = '✓ Saved! Title will appear shortly.';
        btn.textContent = '✓ Saved';
        setTimeout(function() { closeAddSheet(); btn.textContent = 'Save'; btn.disabled = false; status.textContent = ''; load(); }, 1800);
      } else { throw new Error(); }
    } catch(e) {
      status.style.color = 'var(--danger)'; status.textContent = 'Failed — check the URL.';
      btn.textContent = 'Save'; btn.disabled = false;
    }

  } else {
    var lines = document.getElementById('bulk-input').value.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.startsWith('http'); });
    if (!lines.length) { btn.disabled = false; status.textContent = 'No valid URLs found.'; return; }
    btn.textContent = 'Saving ' + lines.length + '…';
    status.textContent = '';
    var ok = 0, fail = 0;
    for (var i = 0; i < lines.length; i++) {
      try {
        var rr = await fetch('/api/wa-saves/add', {method:'POST', headers:_hdrs(), body:JSON.stringify({url: lines[i]})});
        if (rr.ok) ok++; else fail++;
      } catch(ee) { fail++; }
      status.textContent = 'Saved ' + (ok+fail) + ' / ' + lines.length + '…';
    }
    status.style.color = fail ? 'var(--danger)' : 'var(--green)';
    status.textContent = ok + ' saved' + (fail ? ', ' + fail + ' failed' : '') + '.';
    document.getElementById('bulk-input').value = '';
    btn.textContent = 'Save'; btn.disabled = false;
    setTimeout(function() { closeAddSheet(); status.textContent = ''; load(); }, 2000);
  }
}

// ── Collection sheet ──────────────────────────────────────────────────────────
function closeCollSheet() { closeSheet('coll-sheet', 'coll-backdrop'); }

// ── Sheet helpers ─────────────────────────────────────────────────────────────
function openSheet(id, bdId) {
  var s = document.getElementById(id);
  var b = document.getElementById(bdId);
  b.classList.add('open');
  s.classList.add('open');
  requestAnimationFrame(function() { requestAnimationFrame(function() { s.classList.add('slide-up'); }); });
}
function closeSheet(id, bdId) {
  var s = document.getElementById(id);
  var b = document.getElementById(bdId);
  s.classList.remove('slide-up');
  setTimeout(function() { s.classList.remove('open'); b.classList.remove('open'); }, 280);
}

// ── Topbar spacer ─────────────────────────────────────────────────────────────
function setTopbarSpacer() {
  var h = document.getElementById('topbar').offsetHeight;
  document.getElementById('topbar-spacer').style.height = h + 'px';
  document.getElementById('wrap').style.paddingTop = '0';
}

// ── Sign out ──────────────────────────────────────────────────────────────────
function signOut() {
  localStorage.removeItem('wa_saves_token');
  localStorage.removeItem('miru_phone');
  document.cookie = 'miru_saves_token=; max-age=0; path=/';
  document.cookie = 'miru_saves_phone=; max-age=0; path=/';
  showLogin();
}

// ── Screen switch ─────────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
}
function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-view').style.display = 'block';
  document.getElementById('fab').style.display = 'flex';
  load();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(function() {
  setView(_view);
  setTopbarSpacer();
  window.addEventListener('resize', setTopbarSpacer);
  if (_tok() || _phone()) {
    showMain();
  } else {
    showLogin();
    document.getElementById('fab').style.display = 'none';
  }
})();
</script>
