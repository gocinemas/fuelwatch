name: Refresh Intel Campaign Data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh_campaign_data.yml']

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Run refresh
        run: python3 refresh_campaign_data.py
